<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laboratório Virtual 3D - Campo Elétrico (Corrigido)</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: #050508;
            color: #f3f4f6;
        }
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }
        /* Painel de Controlo Avançado (Glassmorphism) */
        .lil-gui {
            --background-color: rgba(10, 11, 18, 0.85);
            --text-color: #f3f4f6;
            --title-background-color: rgba(24, 26, 41, 0.95);
            --widget-color: rgba(43, 47, 74, 0.8);
            --hover-color: #2563eb;
            --focus-color: #60a5fa;
            font-family: inherit;
            border-radius: 14px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 4px;
        }
        .lil-gui .title {
            font-weight: 700;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            font-size: 11px;
            color: #9ca3af;
        }
        #info-panel {
            position: absolute;
            top: 25px;
            left: 25px;
            background: rgba(10, 11, 18, 0.8);
            padding: 18px 24px;
            border-radius: 14px;
            pointer-events: none;
            font-size: 13px;
            line-height: 1.6;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            max-width: 300px;
        }
        h1 {
            margin: 0 0 6px 0;
            font-size: 17px;
            color: #ffffff;
            font-weight: 700;
            letter-spacing: -0.3px;
        }
        p {
            margin: 0;
            color: #9ca3af;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.18"></script>
</head>
<body>

    <div id="info-panel">
        <h1>Simulador de Campo Elétrico</h1>
        <p>Arraste para rodar a câmara 3D. Repare que a Força Elétrica desliga-se automaticamente fora das placas.</p>
    </div>
    <div id="canvas-container"></div>

    <script>
        // --- Configuração da Cena ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050508, 0.015);

        const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 3.5, 12.5);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 + 0.1;

        // Grelha de Laboratório de Alta Tecnologia
        const gridHelper = new THREE.GridHelper(30, 30, 0x222533, 0x12131a);
        gridHelper.position.y = -4;
        scene.add(gridHelper);

        // Iluminação Estilizada e Sofisticada
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.15);
        scene.add(ambientLight);
        
        const lightTop = new THREE.DirectionalLight(0xffffff, 1.4);
        lightTop.position.set(8, 15, 8);
        scene.add(lightTop);

        const lightGlowCyan = new THREE.PointLight(0x00f2ff, 0.8, 20);
        lightGlowCyan.position.set(-6, 4, -4);
        scene.add(lightGlowCyan);

        // --- Parâmetros da Simulação ---
        const params = {
            distancia: 4.2, 
            area: 16.0,      
            massa: 1.0,
            velocidadeInicial: 4.8,
            angulo: 15, 
            sentidoCampo: 'Para Baixo (Topo + / Fundo -)',
            mostrarTrajetoria: true,
            mostrarFe: true,
            mostrarFg: true,
            mostrarVelocidade: true,
            mostrarCampoE: true,
            animando: true,
            playPausa: function() {
                this.animando = !this.animando;
                btnPlayPausa.name(this.animando ? 'Pausar Animação' : 'Iniciar Animação');
            },
            reiniciar: function() {
                resetCarga();
            }
        };

        const fisicaConst = { carga: 2.4, g: 1.6, E_intensidade: 1.6 };

        // --- Elementos Visuais Modernos ---
        let placaSuperior, placaInferior;
        let particula;
        let linhasCampo = [];
        let setaFe, setaFg, setaVel;
        let estaDentroDasPlacas = false; // Flag física crucial
        
        // Rasto Luminoso Estilo Feixe de Eletrões
        const maxPontos = 500;
        const geometriaTrajetoria = new THREE.BufferGeometry();
        const posicoesTrajetoria = new Float32Array(maxPontos * 3);
        geometriaTrajetoria.setAttribute('position', new THREE.BufferAttribute(posicoesTrajetoria, 3));
        
        // Geração interna da textura de partícula suave (Glow)
        const canvasGlow = document.createElement('canvas');
        canvasGlow.width = 32; canvasGlow.height = 32;
        const ctxGlow = canvasGlow.getContext('2d');
        const grad = ctxGlow.createRadialGradient(16,16,0, 16,16,16);
        grad.addColorStop(0, 'rgba(255,255,255,1)');
        grad.addColorStop(0.3, 'rgba(0,242,255,0.8)');
        grad.addColorStop(1, 'rgba(0,242,255,0)');
        ctxGlow.fillStyle = grad; ctxGlow.fillRect(0,0,32,32);
        const texturaGlow = new THREE.CanvasTexture(canvasGlow);

        const materialTrajetoria = new THREE.PointsMaterial({
            color: 0x00f2ff, size: 0.14, transparent: true, opacity: 0.85,
            blending: THREE.AdditiveBlending, map: texturaGlow, depthWrite: false
        });
        const sistemaTrajetoria = new THREE.Points(geometriaTrajetoria, materialTrajetoria);
        scene.add(sistemaTrajetoria);
        let contadorPontos = 0;

        // Placas com Acabamento Premium (Efeito Vidro Refletor)
        const criarPlacaLaboratorio = () => {
            const grupoPlaca = new THREE.Group();
            
            const matVidro = new THREE.MeshPhysicalMaterial({
                color: 0xffffff, transparent: true, opacity: 0.25, roughness: 0.05,
                metalness: 0.1, transmission: 0.5, ior: 1.52, side: THREE.DoubleSide
            });
            const centro = new THREE.Mesh(new THREE.BoxGeometry(1, 0.08, 1), matVidro);
            grupoPlaca.add(centro);

            // Moldura brilhante nas bordas
            const matBorda = new THREE.MeshStandardMaterial({ roughness: 0.1, metalness: 0.95 });
            const bordaSup = new THREE.Mesh(new THREE.BoxGeometry(1.01, 0.01, 1.01), matBorda);
            bordaSup.position.y = 0.041;
            grupoPlaca.add(bordaSup);

            return { grupo: grupoPlaca, centro: centro, borda: bordaSup };
        };

        const pSupObj = criarPlacaLaboratorio(); placaSuperior = pSupObj.grupo; scene.add(placaSuperior);
        const pInfObj = criarPlacaLaboratorio(); placaInferior = pInfObj.grupo; scene.add(placaInferior);

        // CARGA: Esfera Incandescente / Brilhante Autêntica
        const geomParticula = new THREE.SphereGeometry(0.22, 32, 32);
        const matParticula = new THREE.MeshStandardMaterial({
            color: 0xffffff,
            emissive: 0xffaa00,
            emissiveIntensity: 2.0, 
            roughness: 0.05,
            metalness: 0.1
        });
        particula = new THREE.Mesh(geomParticula, matParticula);
        scene.add(particula);

        // Luz omnidirecional que viaja com a carga
        const luzParticula = new THREE.PointLight(0xffaa00, 1.2, 3);
        particula.add(luzParticula);

        let pos = new THREE.Vector3();
        let vel = new THREE.Vector3();

        function resetCarga() {
            const lado = Math.sqrt(params.area);
            pos.set(-lado/2 - 1.4, 0, 0);
            
            const rad = (params.angulo * Math.PI) / 180;
            vel.set(params.velocidadeInicial * Math.cos(rad), params.velocidadeInicial * Math.sin(rad), 0);
            particula.position.copy(pos);
            contadorPontos = 0;
            estaDentroDasPlacas = false;
            
            const arr = sistemaTrajetoria.geometry.attributes.position.array;
            for(let i=0; i<arr.length; i++) arr[i] = 0;
            sistemaTrajetoria.geometry.attributes.position.needsUpdate = true;
            sistemaTrajetoria.geometry.setDrawRange(0, 0);
        }

        function atualizarCondensador() {
            const lado = Math.sqrt(params.area);
            
            placaSuperior.scale.set(lado, 1, lado);
            placaInferior.scale.set(lado, 1, lado);
            
            placaSuperior.position.y = params.distancia / 2;
            placaInferior.position.y = -params.distancia / 2;

            if (params.sentidoCampo === 'Para Baixo (Topo + / Fundo -)') {
                pSupObj.centro.material.color.setHex(0xff3b6f); 
                pSupObj.borda.material.color.setHex(0xff3b6f);
                pInfObj.centro.material.color.setHex(0x2563eb); 
                pInfObj.borda.material.color.setHex(0x2563eb);
            } else {
                pSupObj.centro.material.color.setHex(0x2563eb); 
                pSupObj.borda.material.color.setHex(0x2563eb);
                pInfObj.centro.material.color.setHex(0xff3b6f); 
                pInfObj.borda.material.color.setHex(0xff3b6f);
            }

            atualizarLinhasCampo();
        }

        function atualizarLinhasCampo() {
            linhasCampo.forEach(l => scene.remove(l));
            linhasCampo = [];

            if (!params.mostrarCampoE) return;

            const lado = Math.sqrt(params.area);
            const numLinhas = 5; 
            const passo = lado / (numLinhas - 1 || 1);
            const inicio = -lado / 2;

            const paraBaixo = (params.sentidoCampo === 'Para Baixo (Topo + / Fundo -)');
            const dirY = paraBaixo ? -1 : 1;
            const origemY = paraBaixo ? params.distancia / 2 : -params.distancia / 2;

            for (let i = 0; i < numLinhas; i++) {
                for (let j = 0; j < numLinhas; j++) {
                    const x = inicio + i * passo;
                    const z = inicio + j * passo;
                    
                    const dir = new THREE.Vector3(0, dirY, 0);
                    const origem = new THREE.Vector3(x, origemY, z);
                    
                    const arrowHelper = new THREE.ArrowHelper(dir, origem, params.distancia, 0x374151, 0.12, 0.06);
                    arrowHelper.line.material.transparent = true;
                    arrowHelper.line.material.opacity = 0.3;
                    scene.add(arrowHelper);
                    linhasCampo.push(arrowHelper);
                }
            }
        }

        // --- Atualização dos Vetores com a Condição de Fronteira ---
        function atualizarVetores() {
            if (setaFe) scene.remove(setaFe);
            if (setaFg) scene.remove(setaFg);
            if (setaVel) scene.remove(setaVel);

            const paraBaixo = (params.sentidoCampo === 'Para Baixo (Topo + / Fundo -)');
            const centroCarga = particula.position;

            // CORREÇÃO: Força Elétrica só é visível se estiver fisicamente DENTRO do condensador
            if (params.mostrarFe && estaDentroDasPlacas) {
                const dirFe = new THREE.Vector3(0, paraBaixo ? -1 : 1, 0);
                setaFe = new THREE.ArrowHelper(dirFe, centroCarga, 1.4, 0xff2a5f, 0.22, 0.12);
                scene.add(setaFe);
            }

            // Força Gravítica (Sempre ativa)
            if (params.mostrarFg) {
                const dirFg = new THREE.Vector3(0, -1, 0);
                const magnitudeFg = params.massa * 0.7; 
                const centroDefasado = new THREE.Vector3(centroCarga.x, centroCarga.y, centroCarga.z + 0.04);
                setaFg = new THREE.ArrowHelper(dirFg, centroDefasado, magnitudeFg, 0x1e40af, 0.22, 0.12);
                scene.add(setaFg);
            }

            // Vetor Velocidade (Sempre ativo)
            if (params.mostrarVelocidade && vel.length() > 0) {
                const dirVel = vel.clone().normalize();
                setaVel = new THREE.ArrowHelper(dirVel, centroCarga, vel.length() * 0.35, 0x059669, 0.22, 0.12);
                scene.add(setaVel);
            }
        }

        // --- Menu de Configuração Avançado (lil-gui) ---
        const gui = new lil.GUI({ title: 'Painel de Controlo' });
        gui.domElement.style.position = 'absolute';
        gui.domElement.style.bottom = '25px';
        gui.domElement.style.top = 'auto';
        gui.domElement.style.left = '25px';

        const fGeometria = gui.addFolder('Geometria');
        fGeometria.add(params, 'distancia', 2.0, 6.5, 0.1).name('Distância Placas (d)').onChange(atualizarCondensador);
        fGeometria.add(params, 'area', 4.0, 25.0, 0.5).name('Área das Placas (A)').onChange(atualizarCondensador);
        fGeometria.open();

        const fFisica = gui.addFolder('Propriedades Físicas');
        fFisica.add(params, 'massa', 0.2, 3.5, 0.1).name('Massa da Carga (m)');
        fFisica.add(params, 'velocidadeInicial', 2.0, 8.0, 0.1).name('Velocidade (v₀)').onChange(() => resetCarga());
        fFisica.add(params, 'angulo', -45, 45, 1).name('Ângulo Injeção (º)').onChange(() => resetCarga());
        fFisica.add(params, 'sentidoCampo', [
            'Para Baixo (Topo + / Fundo -)', 
            'Para Cima (Topo - / Fundo +)'
        ]).name('Sentido do Campo (E)').onChange(atualizarCondensador);
        fFisica.open();

        const fVisualizacao = gui.addFolder('Visualização');
        fVisualizacao.add(params, 'mostrarTrajetoria').name('Mostrar Trajetória').onChange(v => sistemaTrajetoria.visible = v);
        fVisualizacao.add(params, 'mostrarFe').name('Mostrar Força Fₑ').onChange(atualizarVetores);
        fVisualizacao.add(params, 'mostrarFg').name('Mostrar Força F_g').onChange(atualizarVetores);
        fVisualizacao.add(params, 'mostrarVelocidade').name('Mostrar Vetor v').onChange(atualizarVetores);
        fVisualizacao.add(params, 'mostrarCampoE').name('Mostrar Linhas E').onChange(atualizarLinhasCampo);

        const fAnimacao = gui.addFolder('Controlo de Execução');
        const btnPlayPausa = fAnimacao.add(params, 'playPausa').name('Pausar Animação');
        fAnimacao.add(params, 'reiniciar').name('Reiniciar Lançamento');
        fAnimacao.open();

        // --- Loop Físico ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            
            let dt = clock.getDelta();
            if (dt > 0.1) dt = 0.1; 

            if (params.animando) {
                const limiteX = Math.sqrt(params.area) / 2;
                let aceleracaoY = -fisicaConst.g; // Gravidade constante atua sempre

                // Verificar se a coordenada X da partícula está no espaço geográfico entre as placas
                if (particula.position.x >= -limiteX && particula.position.x <= limiteX) {
                    estaDentroDasPlacas = true;
                    const sentidoCampoY = (params.sentidoCampo === 'Para Baixo (Topo + / Fundo -)') ? -1 : 1;
                    aceleracaoY += (fisicaConst.carga * fisicaConst.E_intensidade * sentidoCampoY) / params.massa;
                } else {
                    estaDentroDasPlacas = false; // Fora das placas: Força Elétrica = 0
                }

                // Integração de movimento (Euler-Cromer)
                vel.y += aceleracaoY * dt;
                pos.x += vel.x * dt;
                pos.y += vel.y * dt;
                particula.position.copy(pos);

                // Adicionar pontos brilhantes ao feixe da trajetória néon
                if (contadorPontos < maxPontos && params.mostrarTrajetoria) {
                    const positions = sistemaTrajetoria.geometry.attributes.position.array;
                    positions[contadorPontos * 3] = pos.x;
                    positions[contadorPontos * 3 + 1] = pos.y;
                    positions[contadorPontos * 3 + 2] = pos.z;
                    contadorPontos++;
                    sistemaTrajetoria.geometry.setDrawRange(0, contadorPontos);
                    sistemaTrajetoria.geometry.attributes.position.needsUpdate = true;
                }

                // Reset automático ao colidir ou sair de alcance
                if (pos.y >= params.distancia / 2 || pos.y <= -params.distancia / 2 || pos.x > limiteX + 5) {
                    resetCarga();
                }
            }

            atualizarVetores();
            controls.update();
            renderer.render(scene, camera);
        }

        // --- Janela Redimensionável ---
        window.addEventListener('resize', onWindowResize, false);

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- Inicialização ---
        atualizarCondensador();
        resetCarga();
        animate();

    </script>
</body>
</html>
