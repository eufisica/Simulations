<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Órbitas 3D - eufisica</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #d0e8f8;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            gap: 20px;
            user-select: none;
            overflow: hidden;
        }

        #simulation-container {
            width: 900px;
            height: 550px;
            background-color: #111;
            border: 1px solid #c8bda8;
            border-radius: 8px;
            position: relative;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        #time-display {
            position: absolute;
            top: 15px;
            left: 15px;
            font-size: 18px;
            font-weight: 500;
            color: #fff;
            z-index: 10;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.8);
        }

        #canvas3d {
            width: 100%;
            height: 100%;
            display: block;
            border-radius: 8px;
        }

        #control-panel {
            width: 320px;
            max-height: 90vh;
            overflow-y: auto;
            background-color: #ced6ce;
            border: 1px solid #adb5ad;
            border-radius: 8px;
            padding: 15px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .control-group {
            background-color: #bdc7bd;
            border: 1px solid #9ca69c;
            border-radius: 6px;
            padding: 10px;
        }

        .control-title {
            font-weight: bold;
            margin-bottom: 8px;
            color: #2b3a2b;
            font-size: 14px;
        }

        .slider-container {
            margin-bottom: 10px;
        }

        .slider-container label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .slider-container input[type="range"] {
            width: 100%;
        }

        .checkbox-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-bottom: 5px;
        }

        .btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #7a857a;
            border-radius: 4px;
            background-color: #e2e8e2;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover {
            background-color: #f0f4f0;
        }

        .mass-label-m1 { color: #cc2424; font-weight: bold; }
        .mass-label-m2 { color: #2463cc; font-weight: bold; }
        .mass-label-m3 { color: #1e7a1e; font-weight: bold; }
        .mass-label-m4 { color: #b15c00; font-weight: bold; }
        .mass-label-m5 { color: #701eb1; font-weight: bold; }
        .mass-label-m6 { color: #008da5; font-weight: bold; }
        .mass-label-m7 { color: #555555; font-weight: bold; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js",
                "three/addons/controls/OrbitControls": "https://cdn.jsdelivr.net/npm/three@0.128.0/examples/jsm/controls/OrbitControls.js"
            }
        }
    </script>
</head>
<body>

    <div id="simulation-container">
        <div id="time-display">Tempo = <span id="time-val">0.0</span> anos</div>
        <div id="canvas3d"></div>
    </div>

    <div id="control-panel">
        <div class="action-buttons">
            <button id="btn-play-pause" class="btn">Pausar</button>
            <button id="btn-reset" class="btn">Reiniciar</button>
        </div>

        <div class="control-group">
            <div class="slider-container">
                <label>Corpos = <span id="bodies-count">7</span></label>
                <input type="range" id="bodies-slider" min="1" max="7" value="7">
            </div>
            <div class="slider-container">
                <label>Velocidade da Simulação</label>
                <input type="range" id="speed-slider" min="1" max="5" value="3">
            </div>
        </div>

        <div class="control-group">
            <div class="control-title">Massas dos Corpos</div>
            
            <div class="slider-container" id="m1-group">
                <label class="mass-label-m1">m₁ (Sol) = <span id="m1-val">2.0</span> × 10³⁰ kg</label>
                <input type="range" id="m1-slider" min="0.5" max="5" step="0.1" value="2.0">
            </div>
            
            <div class="slider-container" id="m2-group">
                <label class="mass-label-m2">m₂ = <span id="m2-val">6.0</span> × 10²⁴ kg</label>
                <input type="range" id="m2-slider" min="1" max="20" step="0.5" value="6.0">
            </div>
            
            <div class="slider-container" id="m3-group">
                <label class="mass-label-m3">m₃ = <span id="m3-val">2.0</span> × 10²⁴ kg</label>
                <input type="range" id="m3-slider" min="1" max="20" step="0.5" value="2.0">
            </div>

            <div class="slider-container" id="m4-group">
                <label class="mass-label-m4">m₄ = <span id="m4-val">4.0</span> × 10²⁴ kg</label>
                <input type="range" id="m4-slider" min="1" max="20" step="0.5" value="4.0">
            </div>

            <div class="slider-container" id="m5-group">
                <label class="mass-label-m5">m₅ = <span id="m5-val">8.0</span> × 10²⁴ kg</label>
                <input type="range" id="m5-slider" min="1" max="20" step="0.5" value="8.0">
            </div>

            <div class="slider-container" id="m6-group">
                <label class="mass-label-m6">m₆ = <span id="m6-val">5.0</span> × 10²⁴ kg</label>
                <input type="range" id="m6-slider" min="1" max="20" step="0.5" value="5.0">
            </div>

            <div class="slider-container" id="m7-group">
                <label class="mass-label-m7">m₇ = <span id="m7-val">3.0</span> × 10²⁴ kg</label>
                <input type="range" id="m7-slider" min="1" max="20" step="0.5" value="3.0">
            </div>
        </div>

        <div class="control-group checkbox-grid">
            <div class="checkbox-item">
                <input type="checkbox" id="chk-grid">
                <label for="chk-grid">Grelha</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="chk-velocities">
                <label for="chk-velocities">Velocidades</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="chk-trajectories" checked>
                <label for="chk-trajectories">Trajetórias</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="chk-accelerate">
                <label for="chk-accelerate">Acelerar</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="chk-round" checked>
                <label for="chk-round">Arredondar V</label>
            </div>
            <div class="checkbox-item">
                <input type="checkbox" id="chk-cm" checked>
                <label for="chk-cm">Fixar C.M.</label>
            </div>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls';

        // Constantes calibradas para dinâmica orbital em passos de tempo reduzidos
        const G = 10.0; 
        const dt = 0.002;
        let time = 0;
        let numBodies = 7;
        let isRunning = true;
        let bodies = [];

        let scene, camera, renderer, controls;
        let gridHelper;

        const container = document.getElementById('canvas3d');
        const width = 900;
        const height = 550;

        function init3D() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color('#0b0e14');

            camera = new THREE.PerspectiveCamera(60, width / height, 0.1, 1000);
            camera.position.set(0, 30, 45);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(width, height);
            container.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0x404040, 2); 
            scene.add(ambientLight);

            const pointLight = new THREE.PointLight(0xffffff, 2.5, 300);
            pointLight.position.set(0, 0, 0);
            scene.add(pointLight);

            gridHelper = new THREE.GridHelper(60, 60, 0x555555, 0x222222);
            gridHelper.position.y = 0;
            gridHelper.visible = false;
            scene.add(gridHelper);
        }

        function initBodies() {
            bodies.forEach(b => {
                scene.remove(b.mesh);
                if (b.trailLine) scene.remove(b.trailLine);
                if (b.arrowHelper) scene.remove(b.arrowHelper);
            });

            const m1_input = parseFloat(document.getElementById('m1-slider').value);
            const m2_input = parseFloat(document.getElementById('m2-slider').value);
            const m3_input = parseFloat(document.getElementById('m3-slider').value);
            const m4_input = parseFloat(document.getElementById('m4-slider').value);
            const m5_input = parseFloat(document.getElementById('m5-slider').value);
            const m6_input = parseFloat(document.getElementById('m6-slider').value);
            const m7_input = parseFloat(document.getElementById('m7-slider').value);

            const m1 = m1_input * 100; 
            const m2 = m2_input * 0.1;
            const m3 = m3_input * 0.1;
            const m4 = m4_input * 0.1;
            const m5 = m5_input * 0.1;
            const m6 = m6_input * 0.1;
            const m7 = m7_input * 0.1;

            // Velocidade orbital de referência estável v = sqrt(G * M / r)
            const getVObj = (r) => Math.sqrt((G * m1) / r);

            const r2 = 6, r3 = 10, r4 = 14, r5 = 18, r6 = 22, r7 = 26;

            // MODIFICAÇÃO: Todos os corpos começam no eixo X positivo com velocidade puramente no eixo Z positivo
            const rawConfigs = [
                { x: 0,  y: 0, z: 0,   vx: 0, vy: 0, vz: 0,                mass: m1, rad: 1.6,  color: '#e03131' }, 
                { x: r2, y: 0, z: 0,   vx: 0, vy: 0, vz: getVObj(r2),      mass: m2, rad: 0.45, color: '#1c7ed6' }, // Circular
                { x: r3, y: 0, z: 0,   vx: 0, vy: 0, vz: getVObj(r3)*0.82, mass: m3, rad: 0.45, color: '#2b8a3e' }, // Elíptica
                { x: r4, y: 0, z: 0,   vx: 0, vy: 0, vz: getVObj(r4),      mass: m4, rad: 0.55, color: '#b15c00' }, // Circular
                { x: r5, y: 0, z: 0,   vx: 0, vy: 0, vz: getVObj(r5)*1.15, mass: m5, rad: 0.65, color: '#701eb1' }, // Elíptica
                { x: r6, y: 0, z: 0,   vx: 0, vy: 0, vz: getVObj(r6),      mass: m6, rad: 0.45, color: '#008da5' }, // Circular
                { x: r7, y: 0, z: 0,   vx: 0, vy: 0, vz: getVObj(r7)*0.86, mass: m7, rad: 0.4,  color: '#555555' }  // Elíptica
            ];

            bodies = [];

            rawConfigs.forEach((config, idx) => {
                const geometry = new THREE.SphereGeometry(config.rad, 32, 32);
                let material;
                if(idx === 0) {
                    material = new THREE.MeshBasicMaterial({ color: config.color });
                } else {
                    material = new THREE.MeshStandardMaterial({ color: config.color, roughness: 0.4 });
                }
                const mesh = new THREE.Mesh(geometry, material);
                mesh.position.set(config.x, config.y, config.z);
                scene.add(mesh);

                const maxPoints = 2500;
                const trailGeometry = new THREE.BufferGeometry();
                const positions = new Float32Array(maxPoints * 3);
                trailGeometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                const trailMaterial = new THREE.LineBasicMaterial({ color: config.color });
                const trailLine = new THREE.Line(trailGeometry, trailMaterial);
                scene.add(trailLine);

                bodies.push({
                    x: config.x, y: config.y, z: config.z,
                    vx: config.vx, vy: config.vy, vz: config.vz,
                    mass: config.mass, radius: config.rad, color: config.color,
                    mesh: mesh,
                    history: [],
                    trailLine: trailLine,
                    arrowHelper: null
                });
            });

            time = 0;
            document.getElementById('time-val').textContent = "0.0";
        }

        function updatePhysics() {
            if (!isRunning) return;

            const speedMultiplier = parseInt(document.getElementById('speed-slider').value);
            const iterations = speedMultiplier * (document.getElementById('chk-accelerate').checked ? 5 : 2);

            for (let step = 0; step < iterations; step++) {
                let ax = Array(numBodies).fill(0);
                let ay = Array(numBodies).fill(0);
                let az = Array(numBodies).fill(0);

                // Forças Gravitacionais Mútuas N-Corpos
                for (let i = 0; i < numBodies; i++) {
                    for (let j = i + 1; j < numBodies; j++) {
                        let dx = bodies[j].x - bodies[i].x;
                        let dy = bodies[j].y - bodies[i].y;
                        let dz = bodies[j].z - bodies[i].z;
                        let distSq = dx * dx + dy * dy + dz * dz;
                        let dist = Math.sqrt(distSq);

                        if (dist < 0.5) dist = 0.5;

                        let forceMagI = (G * bodies[j].mass) / distSq;
                        let forceMagJ = (G * bodies[i].mass) / distSq;

                        ax[i] += forceMagI * (dx / dist);
                        ay[i] += forceMagI * (dy / dist);
                        az[i] += forceMagI * (dz / dist);

                        ax[j] -= forceMagJ * (dx / dist);
                        ay[j] -= forceMagJ * (dy / dist);
                        az[j] -= forceMagJ * (dz / dist);
                    }
                }

                // Integração de Euler-Cromer Corrigida (Multiplicação por dt na Posição)
                for (let i = 0; i < numBodies; i++) {
                    bodies[i].vx += ax[i] * dt;
                    bodies[i].vy += ay[i] * dt;
                    bodies[i].vz += az[i] * dt;
                    
                    // CORREÇÃO CRÍTICA: Deslocamento ponderado pelo dt da simulação
                    bodies[i].x += bodies[i].vx * dt;
                    bodies[i].y += bodies[i].vy * dt;
                    bodies[i].z += bodies[i].vz * dt;

                    if (document.getElementById('chk-trajectories').checked) {
                        bodies[i].history.push(new THREE.Vector3(bodies[i].x, bodies[i].y, bodies[i].z));
                        if (bodies[i].history.length > 2000) {
                            bodies[i].history.shift();
                        }
                    }
                }

                if (document.getElementById('chk-cm').checked) {
                    let totalMass = 0;
                    let cx = 0, cy = 0, cz = 0;
                    for(let i=0; i<numBodies; i++) {
                        totalMass += bodies[i].mass;
                        cx += bodies[i].x * bodies[i].mass;
                        cy += bodies[i].y * bodies[i].mass;
                        cz += bodies[i].z * bodies[i].mass;
                    }
                    cx /= totalMass; cy /= totalMass; cz /= totalMass;

                    for(let i=0; i<numBodies; i++) {
                        bodies[i].x -= cx;
                        bodies[i].y -= cy;
                        bodies[i].z -= cz;
                    }
                }
                time += 0.001;
            }
            document.getElementById('time-val').textContent = time.toFixed(1);
        }

        function updateGraphics() {
            gridHelper.visible = document.getElementById('chk-grid').checked;

            for (let i = 0; i < bodies.length; i++) {
                const b = bodies[i];
                
                if (i >= numBodies) {
                    b.mesh.visible = false;
                    b.trailLine.visible = false;
                    if (b.arrowHelper) b.arrowHelper.visible = false;
                    continue;
                }

                b.mesh.visible = true;
                b.mesh.position.set(b.x, b.y, b.z);

                if (document.getElementById('chk-trajectories').checked && b.history.length > 1) {
                    b.trailLine.visible = true;
                    const positions = b.trailLine.geometry.attributes.position.array;
                    let index = 0;
                    for (let h = 0; h < b.history.length; h++) {
                        positions[index++] = b.history[h].x;
                        positions[index++] = b.history[h].y;
                        positions[index++] = b.history[h].z;
                    }
                    for (let h = b.history.length; h < 2000; h++) {
                        positions[index++] = b.history[b.history.length - 1].x;
                        positions[index++] = b.history[b.history.length - 1].y;
                        positions[index++] = b.history[b.history.length - 1].z;
                    }
                    b.trailLine.geometry.attributes.position.needsUpdate = true;
                    b.trailLine.geometry.setDrawRange(0, b.history.length);
                } else {
                    b.trailLine.visible = false;
                }

                if (b.arrowHelper) scene.remove(b.arrowHelper);
                if (document.getElementById('chk-velocities').checked && i < numBodies) {
                    const vDir = new THREE.Vector3(b.vx, b.vy, b.vz);
                    const vLength = vDir.length();
                    if(vLength > 0.001) {
                        vDir.normalize();
                        b.arrowHelper = new THREE.ArrowHelper(vDir, b.mesh.position, vLength * 1.5, 0xffffff, 0.4, 0.15);
                        scene.add(b.arrowHelper);
                    }
                }
            }
        }

        function loop() {
            updatePhysics();
            updateGraphics();
            controls.update();
            renderer.render(scene, camera);
            requestAnimationFrame(loop);
        }

        const playPauseBtn = document.getElementById('btn-play-pause');
        playPauseBtn.addEventListener('click', () => {
            isRunning = !isRunning;
            playPauseBtn.textContent = isRunning ? "Pausar" : "Continuar";
        });

        document.getElementById('btn-reset').addEventListener('click', () => {
            initBodies();
        });

        function updateSliderVisibility() {
            for (let i = 2; i <= 7; i++) {
                const group = document.getElementById(`m${i}-group`);
                if (group) group.style.display = numBodies >= i ? 'block' : 'none';
            }
        }

        document.getElementById('bodies-slider').addEventListener('input', (e) => {
            numBodies = parseInt(e.target.value);
            document.getElementById('bodies-count').textContent = numBodies;
            updateSliderVisibility();
            initBodies();
        });

        for (let i = 1; i <= 7; i++) {
            document.getElementById(`m` + i + `-slider`).addEventListener('input', (e) => {
                document.getElementById(`m` + i + `-val`).textContent = e.target.value;
                initBodies();
            });
        }

        init3D();
        updateSliderVisibility();
        initBodies();
        loop();
    </script>
</body>
</html>
