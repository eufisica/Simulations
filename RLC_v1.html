<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação de Circuito RLC Interativo - eufisica</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; color: #1a365d; }
        .container {
            display: flex;
            flex-direction: column;
            width: 1000px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            gap: 20px;
        }
        /* Sliders e Controlos Superiores */
        .controls-top {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .control-group {
            display: flex;
            flex-direction: column;
        }
        .control-group label {
            font-size: 0.9rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: #4a5568;
        }
        .control-group input { width: 100%; }
        
        /* Janela Principal de Visualização */
        .simulation-window {
            position: relative;
            width: 100%;
            height: 350px;
            background: #111827;
            border-radius: 8px;
            overflow: hidden;
        }
        canvas#circuitCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        /* Painéis de Dados Sobrepostos */
        .telemetry-left {
            position: absolute;
            top: 15px;
            left: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: #00ffcc;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            pointer-events: none;
            border: 1px solid #334155;
        }
        .telemetry-right {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: #ffcc00;
            padding: 10px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 0.85rem;
            pointer-events: none;
            border: 1px solid #334155;
        }

        /* Secção do Gráfico */
        .graph-section {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .checkbox-container {
            display: flex;
            gap: 15px;
            margin-bottom: 10px;
            flex-wrap: wrap;
            font-size: 0.9rem;
        }

        /* Secção de Energia */
        .energy-section {
            display: flex;
            background: #f8fafc;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
            align-items: center;
            gap: 40px;
        }
        .donut-container {
            width: 180px;
            height: 180px;
            position: relative;
        }
        .donut-center-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            font-family: monospace;
            font-size: 0.85rem;
            font-weight: bold;
        }
        .energy-lines {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 10px;
            font-family: monospace;
            font-size: 0.95rem;
        }
        .energy-line {
            display: flex;
            justify-content: space-between;
            padding: 6px;
            border-radius: 4px;
            font-weight: bold;
        }
        .e-elec { color: #22c55e; background: rgba(34, 197, 94, 0.1); }
        .e-mag { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
        .e-tot { color: #3b82f6; background: rgba(59, 130, 246, 0.1); }

        /* Botões de Controlo Inferiores */
        .bottom-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 5px;
        }
        .btn {
            padding: 10px 25px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-play { background: #22c55e; color: white; }
        .btn-play:hover { background: #16a34a; }
        .btn-reset { background: #64748b; color: white; }
        .btn-reset:hover { background: #475569; }
    </style>
</head>
<body>

    <h1>Simulador de Circuito RLC</h1>
    
    <div class="container">
        <div class="controls-top">
            <div class="control-group">
                <label>Indutância (L): <span id="valL">1.0</span> H</label>
                <input type="range" id="paramL" min="0.1" max="5.0" step="0.1" value="1.5">
            </div>
            <div class="control-group">
                <label>Capacidade (C): <span id="valC">50</span> µF</label>
                <input type="range" id="paramC" min="10" max="200" step="10" value="100">
            </div>
            <div class="control-group">
                <label>Resistência (R): <span id="valR">0</span> Ω</label>
                <input type="range" id="paramR" min="0" max="50" step="1" value="5">
            </div>
            <div class="control-group">
                <label>Carga Inicial (Q₀): <span id="valQ0">100</span> µC</label>
                <input type="range" id="paramQ0" min="10" max="500" step="10" value="200">
            </div>
            <div class="control-group">
                <label>Velocidade Simulação: <span id="valSpeed">1.0</span>x</label>
                <input type="range" id="paramSpeed" min="0.1" max="3.0" step="0.1" value="1.0">
            </div>
        </div>

        <div class="simulation-window" id="simWindow">
            <canvas id="circuitCanvas" width="1000" height="350"></canvas>
            
            <div class="telemetry-left">
                Freq: <span id="telFreq">0.00</span> Hz<br>
                Período: <span id="telPer">0.00</span> s<br>
                Tempo: <span id="telTime">0.000</span> s
            </div>
            
            <div class="telemetry-right">
                Carga (q): <span id="telQ">0.00</span> µC<br>
                Corrente (i): <span id="telI">0.00</span> mA<br>
                Tensão (Vc): <span id="telV">0.00</span> V
            </div>
        </div>

        <div class="graph-section">
            <div class="checkbox-container">
                <label><input type="checkbox" id="chkQ" checked> Carga q(t)</label>
                <label><input type="checkbox" id="chkI" checked> Corrente i(t)</label>
                <label><input type="checkbox" id="chkUE"> Energ. Elétrica (Uc)</label>
                <label><input type="checkbox" id="chkUB"> Energ. Magnética (Ub)</label>
            </div>
            <div style="position: relative; height:250px; width:100%;">
                <canvas id="mainChart"></canvas>
            </div>
        </div>

        <div class="energy-section">
            <div class="donut-container">
                <canvas id="donutChart"></canvas>
                <div class="donut-center-text">
                    Total<br><span id="txtEtot">0.00</span> µJ
                </div>
            </div>
            <div class="energy-lines">
                <div class="energy-line e-elec">
                    <span>Energia Elétrica (Condensador)</span>
                    <span id="txtEelec">0.00 µJ</span>
                </div>
                <div class="energy-line e-mag">
                    <span>Energia Magnética (Indutor)</span>
                    <span id="txtEmag">0.00 µJ</span>
                </div>
                <div class="energy-line e-tot">
                    <span>Energia Total do Sistema</span>
                    <span id="txtEtotLine">0.00 µJ</span>
                </div>
            </div>
        </div>

        <div class="bottom-buttons">
            <button class="btn btn-play" id="btnPlay">Pausa</button>
            <button class="btn btn-reset" id="btnReset">Reiniciar</button>
        </div>
    </div>

    <script>
        // --- Configurações Físicas e Variáveis Estaduais ---
        let L, C, R, Q0, speed;
        let t = 0;
        let isRunning = true;
        let switchClosed = true;

        // Estado instantâneo
        let q = 0, i = 0, Vc = 0;
        let E_elec = 0, E_mag = 0, E_tot = 0, E_inicial_total = 0;
        let freq = 0, periodo = 0;

        // Histórico para o gráfico linear
        let timeHistory = [];
        let qHistory = [], iHistory = [], ueHistory = [], ubHistory = [];
        const maxHistoryPoints = 400;

        // Elementos DOM
        const canvas = document.getElementById('circuitCanvas');
        const ctx = canvas.getContext('2d');
        
        // Posições das cargas (eletrões) para animação
        let charges = [];
        const numCharges = 24;

        // Inicializar posições ao longo do circuito retangular
        // Circuito retangular de (150, 80) a (850, 280)
        function initCharges() {
            charges = [];
            let perimeter = 2 * (700 + 200);
            for(let k=0; k<numCharges; k++) {
                charges.push((k / numCharges) * perimeter);
            }
        }
        initCharges();

        // --- Gráficos (Chart.js) ---
        const ctxChart = document.getElementById('mainChart').getContext('2d');
        const mainChart = new Chart(ctxChart, {
            type: 'line',
            data: {
                labels: timeHistory,
                datasets: [
                    { label: 'Carga (µC)', data: qHistory, borderColor: '#3b82f6', borderWidth: 2, pointRadius: 0, fill: false, yAxisID: 'y' },
                    { label: 'Corrente (mA)', data: iHistory, borderColor: '#f59e0b', borderWidth: 2, pointRadius: 0, fill: false, yAxisID: 'y1' },
                    { label: 'U Elétrica (µJ)', data: ueHistory, borderColor: '#22c55e', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: false, yAxisID: 'y2' },
                    { label: 'U Magnética (µJ)', data: ubHistory, borderColor: '#ef4444', borderWidth: 1.5, borderDash: [4,4], pointRadius: 0, fill: false, yAxisID: 'y2' }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                animation: false,
                scales: {
                    x: { display: true, title: { display: true, text: 'Tempo (s)' } },
                    y: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Carga / Corrente' } },
                    y1: { type: 'linear', display: false, position: 'right' },
                    y2: { type: 'linear', display: false, position: 'right' }
                },
                plugins: { legend: { display: false } }
            }
        });

        const ctxDonut = document.getElementById('donutChart').getContext('2d');
        const donutChart = new Chart(ctxDonut, {
            type: 'doughnut',
            data: {
                labels: ['Elétrica', 'Magnética', 'Dissipada'],
                datasets: [{
                    data: [50, 50, 0],
                    backgroundColor: ['#22c55e', '#ef4444', '#cbd5e1'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '75%',
                animation: false,
                plugins: { legend: { display: false }, tooltip: { enabled: false } }
            }
        });

        // --- Atualização de Parâmetros pelos Sliders ---
        function updateParams() {
            L = parseFloat(document.getElementById('paramL').value);
            C = parseFloat(document.getElementById('paramC').value) * 1e-6; // converter µF para F
            R = parseFloat(document.getElementById('paramR').value);
            Q0 = parseFloat(document.getElementById('paramQ0').value) * 1e-6; // converter µC para C
            speed = parseFloat(document.getElementById('paramSpeed').value);

            document.getElementById('valL').innerText = L.toFixed(1);
            document.getElementById('valC').innerText = (C*1e6).toFixed(0);
            document.getElementById('valR').innerText = R;
            document.getElementById('valQ0').innerText = (Q0*1e6).toFixed(0);
            document.getElementById('valSpeed').innerText = speed.toFixed(1);

            // Frequência e Período Angulares Teóricos (Subamortecido / Sem amortecimento)
            let w0_sq = 1 / (L * C);
            let alpha = R / (2 * L);
            let wd_sq = w0_sq - alpha * alpha;
            
            let w = (wd_sq > 0) ? Math.sqrt(wd_sq) : 0;
            freq = (w > 0) ? w / (2 * Math.PI) : 0;
            periodo = (freq > 0) ? 1 / freq : Infinity;

            document.getElementById('telFreq').innerText = freq.toFixed(2);
            document.getElementById('telPer').innerText = isFinite(periodo) ? periodo.toFixed(3) : "∞";
        }

        // --- Cálculos Físicos Exatos (Equações Diferenciais) ---
        function calculateState(time) {
            let alpha = R / (2 * L);
            let w0_sq = 1 / (L * C);
            let disc = alpha * alpha - w0_sq;

            if (R === 0) {
                // Sem Amortecimento (Caso Ideal)
                let w0 = Math.sqrt(w0_sq);
                q = Q0 * Math.cos(w0 * time);
                i = -Q0 * w0 * Math.sin(w0 * time);
            } else if (disc < 0) {
                // Subamortecido
                let wd = Math.sqrt(w0_sq - alpha * alpha);
                let phi = Math.atan(-alpha / wd);
                let A = Q0 / Math.cos(phi);
                q = A * Math.exp(-alpha * time) * Math.cos(wd * time + phi);
                // Derivada da carga para obter a corrente
                i = -A * alpha * Math.exp(-alpha * time) * Math.cos(wd * time + phi) 
                    - A * wd * Math.exp(-alpha * time) * Math.sin(wd * time + phi);
            } else if (disc > 0) {
                // Superamortecido
                let r1 = -alpha + Math.sqrt(disc);
                let r2 = -alpha - Math.sqrt(disc);
                let A1 = (Q0 * r2) / (r2 - r1);
                let A2 = (-Q0 * r1) / (r2 - r1);
                q = A1 * Math.exp(r1 * time) + A2 * Math.exp(r2 * time);
                i = A1 * r1 * Math.exp(r1 * time) + A2 * r2 * Math.exp(r2 * time);
            } else {
                // Amortecimento Crítico
                let A1 = Q0;
                let A2 = alpha * Q0;
                q = (A1 + A2 * time) * Math.exp(-alpha * time);
                i = A2 * Math.exp(-alpha * time) - alpha * (A1 + A2 * time) * Math.exp(-alpha * time);
            }

            Vc = q / C;
            E_elec = (q * q) / (2 * C);
            E_mag = 0.5 * L * i * i;
            E_tot = E_elec + E_mag;
            if (time === 0 || E_tot > E_inicial_total) E_inicial_total = (Q0 * Q0) / (2 * C);
        }

        // --- Desenho do Circuito e Animações no Canvas ---
        function getCoordinates(p) {
            // Converte um perímetro escalar 'p' numa coordenada (x,y) do circuito retangular
            let w = 700, h = 180;
            let x0 = 150, y0 = 85;
            p = p % (2 * (w + h));
            if (p < 0) p += 2 * (w + h);

            if (p < w) return {x: x0 + p, y: y0};
            p -= w;
            if (p < h) return {x: x0 + w, y: y0 + p};
            p -= h;
            if (p < w) return {x: x0 + w - p, y: y0 + h};
            p -= w;
            return {x: x0, y: y0 + h - p};
        }

        function drawCircuit() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Linhas base do circuito (Trilho)
            ctx.strokeStyle = "#4b5563";
            ctx.lineWidth = 4;
            ctx.strokeRect(150, 85, 700, 180);

            // 1. Desenhar o Condensador (Esquerda)
            ctx.fillStyle = "#111827";
            ctx.fillRect(135, 150, 30, 50); // limpar fundo
            ctx.strokeStyle = "#3b82f6";
            ctx.beginPath();
            ctx.moveTo(135, 155); ctx.lineTo(165, 155); // Placa Superior
            ctx.moveTo(135, 195); ctx.lineTo(165, 195); // Placa Inferior
            ctx.stroke();

            // Linhas de campo elétrico dentro do condensador
            let maxLines = 7;
            let capIntensity = Math.abs(q) / (Q0 || 1);
            if (capIntensity > 0.05) {
                ctx.strokeStyle = q > 0 ? "rgba(0, 255, 200," + capIntensity + ")" : "rgba(255, 100, 100," + capIntensity + ")";
                ctx.lineWidth = 2;
                for (let k = 0; k < maxLines; k++) {
                    let xl = 138 + (k * 4);
                    ctx.beginPath();
                    if (q > 0) { // De cima para baixo
                        ctx.moveTo(xl, 158); ctx.lineTo(xl, 192);
                    } else { // De baixo para cima
                        ctx.moveTo(xl, 192); ctx.lineTo(xl, 158);
                    }
                    ctx.stroke();
                }
            }

            // 2. Desenhar a Resistência (Cima)
            ctx.fillStyle = "#111827";
            ctx.fillRect(450, 70, 100, 30);
            ctx.strokeStyle = "#f43f5e";
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.moveTo(450, 85);
            let rx = 450;
            for(let k=0; k<6; k++) {
                rx += 14;
                let ry = (k % 2 === 0) ? 73 : 97;
                ctx.lineTo(rx, ry);
            }
            ctx.lineTo(550, 85);
            ctx.stroke();

            // 3. Desenhar o Indutor (Direita)
            ctx.fillStyle = "#111827";
            ctx.fillRect(835, 140, 30, 70);
            ctx.strokeStyle = "#eab308";
            ctx.lineWidth = 3;
            ctx.beginPath();
            let iy = 140;
            ctx.moveTo(850, iy);
            for(let k=0; k<5; k++) {
                ctx.bezierCurveTo(870, iy, 870, iy+14, 850, iy+14);
                iy += 14;
            }
            ctx.stroke();

            // 4. Desenhar o Interruptor (Baixo)
            ctx.fillStyle = "#111827";
            ctx.fillRect(470, 250, 60, 30);
            ctx.strokeStyle = "#ffffff";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(470, 265);
            if (switchClosed) {
                ctx.lineTo(530, 265);
            } else {
                ctx.lineTo(520, 240); // aberto apontando para cima
            }
            ctx.stroke();
            // Bornes do interruptor
            ctx.fillStyle = "#ffffff";
            ctx.beginPath(); ctx.arc(470, 265, 4, 0, 2*Math.PI); ctx.fill();
            ctx.beginPath(); ctx.arc(530, 265, 4, 0, 2*Math.PI); ctx.fill();

            // 5. Desenhar e Mover Eletrões (Sentido real da Corrente)
            // No sentido real, os eletrões movem-se do polo negativo para o positivo.
            // i (corrente convencional) positiva significa movimento anti-horário de eletrões.
            if (switchClosed && isRunning) {
                let deltaP = -i * 60000 * speed; // fator de escala visual
                for(let k=0; k<numCharges; k++) {
                    charges[k] = (charges[k] + deltaP);
                    let coord = getCoordinates(charges[k]);
                    ctx.fillStyle = "#00ffff";
                    ctx.shadowBlur = 4;
                    ctx.shadowColor = "#00ffff";
                    ctx.beginPath();
                    ctx.arc(coord.x, coord.y, 4, 0, 2*Math.PI);
                    ctx.fill();
                    ctx.shadowBlur = 0; // reset
                }
            } else {
                // Desenhar paradas se a simulação estiver pausada
                for(let k=0; k<numCharges; k++) {
                    let coord = getCoordinates(charges[k]);
                    ctx.fillStyle = "#00cccc";
                    ctx.beginPath();
                    ctx.arc(coord.x, coord.y, 3, 0, 2*Math.PI);
                    ctx.fill();
                }
            }
        }

        // --- Atualização de UI e Telemetria ---
        function updateUI() {
            document.getElementById('telTime').innerText = t.toFixed(3);
            document.getElementById('telQ').innerText = (q * 1e6).toFixed(2);
            document.getElementById('telI').innerText = (i * 1e3).toFixed(2);
            document.getElementById('telV').innerText = Vc.toFixed(2);

            // Valores de Energia (convertidos para microjoules para melhor leitura visual)
            let ee_uj = E_elec * 1e6;
            let em_uj = E_mag * 1e6;
            let et_uj = E_tot * 1e6;

            document.getElementById('txtEelec').innerText = ee_uj.toFixed(2) + " µJ";
            document.getElementById('txtEmag').innerText = em_uj.toFixed(2) + " µJ";
            document.getElementById('txtEtotLine').innerText = et_uj.toFixed(2) + " µJ";
            document.getElementById('txtEtot').innerText = et_uj.toFixed(2);

            // Atualizar Donut Chart
            let e_dissipada = Math.max(0, (E_inicial_total - E_tot) * 1e6);
            donutChart.data.datasets[0].data = [ee_uj, em_uj, e_dissipada];
            donutChart.update();

            // Gerir visibilidade das linhas do gráfico com base nas Checkboxes
            mainChart.setDatasetVisibility(0, document.getElementById('chkQ').checked);
            mainChart.setDatasetVisibility(1, document.getElementById('chkI').checked);
            mainChart.setDatasetVisibility(2, document.getElementById('chkUE').checked);
            mainChart.setDatasetVisibility(3, document.getElementById('chkUB').checked);
            mainChart.update();
        }

        // --- Loop Principal de Animação ---
        let lastTime = performance.now();
        function loop(now) {
            if (isRunning && switchClosed) {
                let dt = (now - lastTime) / 1000;
                // Evitar saltos grandes se o utilizador mudar de aba
                if (dt > 0.1) dt = 0.1; 
                
                t += dt * speed;

                calculateState(t);

                // Guardar histórico para o gráfico linear
                if (timeHistory.length > maxHistoryPoints) {
                    timeHistory.shift();
                    qHistory.shift();
                    iHistory.shift();
                    ueHistory.shift();
                    ubHistory.shift();
                }
                timeHistory.push(t.toFixed(2));
                qHistory.push(q * 1e6);
                iHistory.push(i * 1e3);
                ueHistory.push(E_elec * 1e6);
                ubHistory.push(E_mag * 1e6);
            }
            
            lastTime = now;
            
            drawCircuit();
            updateUI();
            
            requestAnimationFrame(loop);
        }

        // --- Eventos de Interface e Inicialização ---
        function resetSimulation() {
            t = 0;
            timeHistory.length = 0;
            qHistory.length = 0;
            iHistory.length = 0;
            ueHistory.length = 0;
            ubHistory.length = 0;
            updateParams();
            calculateState(0);
            initCharges();
            mainChart.update();
        }

        // Listeners dos Sliders
        const inputs = ['paramL', 'paramC', 'paramR', 'paramQ0', 'paramSpeed'];
        inputs.forEach(id => document.getElementById(id).addEventListener('input', () => {
            updateParams();
            if (t === 0) calculateState(0); // Atualizar instantaneamente em repouso
        }));

        // Botão Play/Pausa
        const btnPlay = document.getElementById('btnPlay');
        btnPlay.addEventListener('click', () => {
            isRunning = !isRunning;
            btnPlay.innerText = isRunning ? "Pausa" : "Play";
            btnPlay.style.background = isRunning ? "#22c55e" : "#3b82f6";
        });

        // Botão Reiniciar
        document.getElementById('btnReset').addEventListener('click', resetSimulation);

        // Interação com o Interruptor por clique no Canvas
        canvas.addEventListener('click', (e) => {
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // Área aproximada do interruptor (470 a 530 em X, 240 a 280 em Y)
            if (x >= 450 && x <= 550 && y >= 230 && y <= 290) {
                switchClosed = !switchClosed;
            }
        });

        // Inicialização Inicial
        updateParams();
        calculateState(0);
        requestAnimationFrame(loop);
    </script>
</body>
</html>
