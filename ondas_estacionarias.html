
<h2 class="sr-only">Simulação interativa de ondas estacionárias com controlo de frequência, densidade do meio, amplitude e amortecimento.</h2>

<style>
  .sim-wrap { padding: 1rem 0; font-family: var(--font-sans); }
  .canvas-box { background: var(--color-background-secondary); border-radius: var(--border-radius-lg); border: 0.5px solid var(--color-border-tertiary); padding: 1rem; margin-bottom: 1rem; }
  canvas { display: block; width: 100%; border-radius: 6px; }
  .controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .ctrl { display: flex; flex-direction: column; gap: 4px; }
  .ctrl label { font-size: 13px; color: var(--color-text-secondary); }
  .ctrl-row { display: flex; align-items: center; gap: 8px; }
  .ctrl-row input[type=range] { flex: 1; }
  .ctrl-val { font-size: 13px; font-weight: 500; min-width: 48px; text-align: right; color: var(--color-text-primary); }
  .info-bar { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 1rem; }
  .info-card { background: var(--color-background-secondary); border-radius: var(--border-radius-md); padding: 10px 12px; border: 0.5px solid var(--color-border-tertiary); }
  .info-card span { display: block; font-size: 11px; color: var(--color-text-secondary); margin-bottom: 2px; }
  .info-card strong { font-size: 16px; font-weight: 500; color: var(--color-text-primary); }
  .btn-row { display: flex; gap: 8px; margin-top: 8px; }
  button { font-size: 13px; padding: 6px 14px; }
  .mode-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .mode-btn { font-size: 12px; padding: 4px 12px; cursor: pointer; border: 0.5px solid var(--color-border-secondary); border-radius: var(--border-radius-md); background: var(--color-background-primary); color: var(--color-text-secondary); }
  .mode-btn.active { background: var(--color-background-secondary); color: var(--color-text-primary); border-color: var(--color-border-primary); font-weight: 500; }
</style>

<div class="sim-wrap">
  <div class="mode-row">
    <button class="mode-btn active" id="btn-corda">Corda</button>
    <button class="mode-btn" id="btn-sonoro">Tubo sonoro</button>
    <button class="mode-btn" id="btn-harmonicos">Harmônicos</button>
  </div>

  <div class="canvas-box">
    <canvas id="wave-canvas" height="220"></canvas>
  </div>

  <div class="controls">
    <div class="ctrl">
      <label>Frequência <em style="font-style:normal;font-size:11px;color:var(--color-text-secondary)">(Hz)</em></label>
      <div class="ctrl-row">
        <input type="range" id="freq" min="0.5" max="8" step="0.1" value="2">
        <span class="ctrl-val" id="freq-val">2.0 Hz</span>
      </div>
    </div>
    <div class="ctrl">
      <label>Amplitude</label>
      <div class="ctrl-row">
        <input type="range" id="amp" min="5" max="80" step="1" value="40">
        <span class="ctrl-val" id="amp-val">40</span>
      </div>
    </div>
    <div class="ctrl">
      <label>Modo harmônico <em style="font-style:normal;font-size:11px;color:var(--color-text-secondary)">(n)</em></label>
      <div class="ctrl-row">
        <input type="range" id="harm" min="1" max="8" step="1" value="1">
        <span class="ctrl-val" id="harm-val">n = 1</span>
      </div>
    </div>
    <div class="ctrl">
      <label>Densidade do meio <em style="font-style:normal;font-size:11px;color:var(--color-text-secondary)">(kg/m)</em></label>
      <div class="ctrl-row">
        <input type="range" id="dens" min="0.1" max="5" step="0.1" value="1">
        <span class="ctrl-val" id="dens-val">1.0</span>
      </div>
    </div>
    <div class="ctrl">
      <label>Tensão / Rigidez</label>
      <div class="ctrl-row">
        <input type="range" id="tens" min="1" max="200" step="1" value="50">
        <span class="ctrl-val" id="tens-val">50 N</span>
      </div>
    </div>
    <div class="ctrl">
      <label>Amortecimento</label>
      <div class="ctrl-row">
        <input type="range" id="damp" min="0" max="0.8" step="0.01" value="0">
        <span class="ctrl-val" id="damp-val">0.00</span>
      </div>
    </div>
  </div>

  <div class="btn-row">
    <button id="btn-play">Pausar</button>
    <button id="btn-reset">Reiniciar</button>
    <button id="btn-nodes">Mostrar nós/ventres</button>
  </div>

  <div class="info-bar">
    <div class="info-card"><span>Comprimento de onda</span><strong id="info-lambda">—</strong></div>
    <div class="info-card"><span>Velocidade de fase</span><strong id="info-v">—</strong></div>
    <div class="info-card"><span>Nós</span><strong id="info-nos">—</strong></div>
    <div class="info-card"><span>Ventres</span><strong id="info-ventres">—</strong></div>
  </div>
</div>

<script>
const canvas = document.getElementById('wave-canvas');
const ctx = canvas.getContext('2d');
let W, H;

function resize() {
  const r = canvas.getBoundingClientRect();
  W = canvas.width = r.width * devicePixelRatio;
  H = canvas.height = 220 * devicePixelRatio;
  canvas.style.height = '220px';
}
resize();

let paused = false, showNodes = false, t = 0;
let mode = 'corda';

const getVal = id => parseFloat(document.getElementById(id).value);

function calcPhysics() {
  const f = getVal('freq');
  const n = getVal('harm');
  const rho = getVal('dens');
  const T = getVal('tens');
  const v = Math.sqrt(T / rho);
  const L = 1;
  const lambda = (2 * L) / n;
  const fRes = v / lambda;
  return { f, n, rho, T, v, lambda, fRes };
}

function updateInfo() {
  const { n, v, lambda } = calcPhysics();
  document.getElementById('info-lambda').textContent = lambda.toFixed(2) + ' m';
  document.getElementById('info-v').textContent = v.toFixed(1) + ' m/s';
  document.getElementById('info-nos').textContent = n + 1;
  document.getElementById('info-ventres').textContent = n;
}

function getColors() {
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  return {
    wave1: dark ? '#7B8FE8' : '#3B5BDB',
    wave2: dark ? '#E8889A' : '#C92A2A',
    standing: dark ? '#56CFAA' : '#0F6E56',
    node: dark ? '#FAC775' : '#BA7517',
    bg: dark ? '#1a1a1a' : '#f8f7f4',
    grid: dark ? 'rgba(255,255,255,0.06)' : 'rgba(0,0,0,0.06)',
    text: dark ? 'rgba(255,255,255,0.5)' : 'rgba(0,0,0,0.4)',
    axis: dark ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)'
  };
}

function draw() {
  const f = getVal('freq');
  const amp = getVal('amp') * devicePixelRatio;
  const n = getVal('harm');
  const damp = getVal('damp');
  const { v } = calcPhysics();
  const c = getColors();

  ctx.clearRect(0, 0, W, H);

  const cx = W / 2;
  const cy = H / 2;

  ctx.strokeStyle = c.axis;
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(20, cy);
  ctx.lineTo(W - 20, cy);
  ctx.stroke();

  const L = W - 40;
  const omega = 2 * Math.PI * f;
  const k = (n * Math.PI) / L;
  const dampFac = Math.exp(-damp * t * 0.3);

  if (mode === 'harmonicos') {
    const rows = Math.min(n, 4);
    const rowH = (H - 20) / rows;
    for (let ni = 1; ni <= rows; ni++) {
      const ry = (ni - 0.5) * rowH;
      const ki = (ni * Math.PI) / L;
      const ai = (amp * 0.5) / ni;
      ctx.strokeStyle = `hsl(${210 + ni * 40}, 70%, ${matchMedia('(prefers-color-scheme: dark)').matches ? 65 : 45}%)`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      for (let px = 0; px <= L; px++) {
        const x = 20 + px;
        const y = ry + ai * Math.sin(ki * px) * Math.cos(omega * t) * dampFac;
        px === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.fillStyle = c.text;
      ctx.font = `${11 * devicePixelRatio}px sans-serif`;
      ctx.fillText(`n=${ni}`, 4, ry - ai - 4);
    }
    return;
  }

  if (mode === 'corda') {
    ctx.strokeStyle = c.wave1;
    ctx.lineWidth = 1.2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    for (let px = 0; px <= L; px++) {
      const x = 20 + px;
      const y = cy + (amp / 2) * Math.sin(k * px - omega * t) * dampFac;
      px === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();

    ctx.strokeStyle = c.wave2;
    ctx.beginPath();
    for (let px = 0; px <= L; px++) {
      const x = 20 + px;
      const y = cy + (amp / 2) * Math.sin(k * px + omega * t) * dampFac;
      px === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    ctx.setLineDash([]);
  }

  ctx.strokeStyle = c.standing;
  ctx.lineWidth = 2.5;
  ctx.beginPath();
  for (let px = 0; px <= L; px++) {
    const x = 20 + px;
    let y;
    if (mode === 'sonoro') {
      y = cy + amp * Math.cos(k * px) * Math.cos(omega * t) * dampFac;
    } else {
      y = cy + amp * Math.sin(k * px) * Math.cos(omega * t) * dampFac;
    }
    px === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  ctx.stroke();

  if (showNodes) {
    const totalNodes = mode === 'sonoro' ? n + 1 : n + 1;
    for (let i = 0; i <= n; i++) {
      let xn;
      if (mode === 'sonoro') {
        xn = 20 + (i / n) * L;
      } else {
        xn = 20 + (i / n) * L;
      }
      ctx.beginPath();
      ctx.arc(xn, cy, 5 * devicePixelRatio, 0, 2 * Math.PI);
      ctx.fillStyle = c.node;
      ctx.fill();
    }

    for (let i = 0; i < n; i++) {
      const xv = 20 + ((i + 0.5) / n) * L;
      ctx.beginPath();
      ctx.arc(xv, cy, 4 * devicePixelRatio, 0, 2 * Math.PI);
      ctx.fillStyle = c.standing;
      ctx.fill();
    }

    ctx.font = `${10 * devicePixelRatio}px sans-serif`;
    ctx.fillStyle = c.node;
    ctx.fillText('nó', 20 + L * 0.5 / n - 8, cy - amp - 8);
    ctx.fillStyle = c.standing;
    ctx.fillText('ventre', 20 + L * 0.5 / n + L / (2 * n) - 16, cy - amp - 8);
  }

  ctx.fillStyle = c.axis;
  ctx.beginPath(); ctx.arc(20, cy, 5, 0, 2 * Math.PI); ctx.fill();
  ctx.beginPath(); ctx.arc(W - 20, cy, 5, 0, 2 * Math.PI); ctx.fill();
}

function loop() {
  if (!paused) t += 0.016;
  draw();
  updateInfo();
  requestAnimationFrame(loop);
}

const sliders = ['freq','amp','harm','dens','tens','damp'];
sliders.forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('input', () => {
    const v = parseFloat(el.value);
    if (id === 'freq') document.getElementById('freq-val').textContent = v.toFixed(1) + ' Hz';
    else if (id === 'amp') document.getElementById('amp-val').textContent = v;
    else if (id === 'harm') document.getElementById('harm-val').textContent = 'n = ' + v;
    else if (id === 'dens') document.getElementById('dens-val').textContent = v.toFixed(1);
    else if (id === 'tens') document.getElementById('tens-val').textContent = v + ' N';
    else if (id === 'damp') document.getElementById('damp-val').textContent = v.toFixed(2);
  });
});

document.getElementById('btn-play').addEventListener('click', function() {
  paused = !paused;
  this.textContent = paused ? 'Continuar' : 'Pausar';
});
document.getElementById('btn-reset').addEventListener('click', () => { t = 0; });
document.getElementById('btn-nodes').addEventListener('click', function() {
  showNodes = !showNodes;
  this.textContent = showNodes ? 'Ocultar nós/ventres' : 'Mostrar nós/ventres';
});

['btn-corda','btn-sonoro','btn-harmonicos'].forEach(id => {
  document.getElementById(id).addEventListener('click', function() {
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    mode = id.replace('btn-','');
    t = 0;
  });
});

window.addEventListener('resize', resize);
loop();
</script>
