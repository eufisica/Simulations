<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>eufisica - Tubos de Raios Catódicos</title>
    <style>
        body {
            margin: 0;
            background-color: #f6f6f9;
            color: #ccc;
            font-family: Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        /* Interface por cima do Canvas 3D */
        .header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
            pointer-events: none;
        }

        .logo-title {
            background-color: rgba(28, 28, 30, 0.9);
            padding: 12px 24px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            border: 1px solid #333;
            pointer-events: auto;
        }

        .logo-title span:first-child {
            color: #fff;
            font-size: 1.1rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .logo-title span:last-child {
            color: #4CAF50;
            font-size: 0.85rem;
            margin-top: 4px;
        }

        .fullscreen-btn {
            background-color: rgba(28, 28, 30, 0.9);
            color: #ddd;
            border: 1px solid #333;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            pointer-events: auto;
        }

        .controls-info {
            position: absolute;
            top: 110px;
            left: 20px;
            background-color: rgba(28, 28, 30, 0.9);
            padding: 15px;
            border-radius: 8px;
            width: 290px;
            border: 1px solid #333;
            z-index: 10;
            font-size: 0.85rem;
        }

        .controls-info h4 { margin: 0 0 10px 0; color: #fff; }
        .controls-info ul { list-style: none; padding: 0; margin: 0 0 10px 0; line-height: 1.6; }
        .controls-info p { margin: 0; font-style: italic; color: #888; }

        .crt-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background-color: rgba(28, 28, 30, 0.9);
            padding: 20px;
            border-radius: 8px;
            width: 280px;
            border: 1px solid #333;
            z-index: 10;
        }

        .crt-controls h3 {
            margin: 0 0 15px 0;
            font-size: 1.1rem;
            color: #fff;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }

        .operating-mode-title {
            color: #4CAF50;
            font-size: 0.8rem;
            font-weight: bold;
            margin-bottom: 6px;
            text-transform: uppercase;
        }

        .crt-controls select {
            width: 100%;
            background-color: #2c2c2e;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 8px;
            margin-bottom: 18px;
            outline: none;
        }

        .crt-controls label { display: block; font-size: 0.85rem; margin-bottom: 8px; }
        .control-value { float: right; color: #4CAF50; font-weight: bold; }
        .crt-controls input[type="range"] { width: 100%; accent-color: #4CAF50; margin-bottom: 15px; }

        #canvas3d {
            width: 100vw;
            height: 100vh;
            display: block;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="logo-title">
            <span>TUBOS DE RAIOS CATÓDICOS</span>
            <span>eufisica</span>
        </div>
        <button class="fullscreen-btn" onclick="document.documentElement.requestFullscreen()">Fullscreen</button>
    </div>

    <div class="controls-info">
        <h4>Controlos:</h4>
        <ul>
            <li>Arrastar c/ Botão Esquerdo: Rodar Câmara 3D</li>
            <li>Roda do Rato: Zoom In / Out</li>
            <li>Arrastar c/ Botão Direito: Mover no Espaço</li>
        </ul>
        <p>Use os sliders abaixo para interagir com os eletrões.</p>
    </div>

    <div id="canvas3d"></div>

    <div class="crt-controls">
        <h3>Controlar o Feixe de Eletrões</h3>
        
        <div class="operating-mode-title">Modo de Operação</div>
        <select id="operatingMode">
            <option value="sine">Onda (sinusoidal)</option>
            <option value="tvRaster">Imagem rasterizada</option>
            <option value="singleSpot">Ponto</option>
        </select>

        <label for="controlGrid">Intensidade do Feixe <span id="gridValue" class="control-value">-20 V</span></label>
        <input type="range" id="controlGrid" min="-50" max="0" value="-20">

        <label for="beamFocus">Focagem do Feixe <span id="focusValue" class="control-value">90%</span></label>
        <input type="range" id="beamFocus" min="10" max="100" value="90">

        <label for="horizFreq">Oscilação Horizontal <span id="horizValue" class="control-value">0%</span></label>
        <input type="range" id="horizFreq" min="0" max="100" value="0">
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        let scene, camera, renderer, controls;
        let electrons = [];
        let time = 0;
        let screenGlow;

        const gridSlider = document.getElementById('controlGrid');
        const gridValue = document.getElementById('gridValue');
        const focusSlider = document.getElementById('beamFocus');
        const focusValue = document.getElementById('focusValue');
        const horizSlider = document.getElementById('horizFreq');
        const horizValue = document.getElementById('horizValue');
        const modeSelect = document.getElementById('operatingMode');

        gridSlider.addEventListener('input', () => gridValue.textContent = gridSlider.value + ' V');
        focusSlider.addEventListener('input', () => focusValue.textContent = focusSlider.value + '%');
        horizSlider.addEventListener('input', () => horizValue.textContent = horizSlider.value + '%');

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x2e2e31);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(-5, 3, 7);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('canvas3d').appendChild(renderer.domElement);

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;

            const ambientLight = new THREE.AmbientLight(0xffffff, 0.3);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(5, 10, 7);
            scene.add(dirLight);

            construirTuboCRT();

            window.addEventListener('resize', onWindowResize);
        }

        function construirTuboCRT() {
            const tubeGroup = new THREE.Group();

            const glassMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x99b3ff,
                transparent: true,
                opacity: 0.35,
                roughness: 0.2,
                metalness: 0.1,
                transmission: 0.4, 
                side: THREE.DoubleSide
            });

            const neckGeo = new THREE.CylinderGeometry(0.3, 0.3, 2.5, 32, 1, true);
            const neck = new THREE.Mesh(neckGeo, glassMaterial);
            neck.rotation.z = Math.PI / 2;
            neck.position.x = -1.25;
            tubeGroup.add(neck);

            const funnelGeo = new THREE.CylinderGeometry(1.5, 0.3, 2, 32, 1, true);
            const funnel = new THREE.Mesh(funnelGeo, glassMaterial);
            funnel.rotation.z = -Math.PI / 2;
            funnel.position.x = 1;
            tubeGroup.add(funnel);

            const screenGeo = new THREE.CircleGeometry(1.5, 32);
            const screenMat = new THREE.MeshBasicMaterial({ color: 0x0a1a0a, side: THREE.DoubleSide });
            const screen = new THREE.Mesh(screenGeo, screenMat);
            screen.rotation.y = Math.PI / 2;
            screen.position.x = 2.0;
            tubeGroup.add(screen);

            const glowGeo = new THREE.CircleGeometry(1.49, 32);
            const glowMat = new THREE.MeshBasicMaterial({ 
                color: 0x00ff66, 
                transparent: true, 
                opacity: 0.5, 
                side: THREE.DoubleSide 
            });
            screenGlow = new THREE.Mesh(glowGeo, glowMat);
            screenGlow.rotation.y = Math.PI / 2;
            screenGlow.position.x = 2.01; 
            tubeGroup.add(screenGlow);

            const cathodeGeo = new THREE.CylinderGeometry(0.1, 0.1, 0.3, 16);
            const cathodeMat = new THREE.MeshBasicMaterial({ color: 0xff4500 });
            const cathode = new THREE.Mesh(cathodeGeo, cathodeMat);
            cathode.rotation.z = Math.PI / 2;
            cathode.position.x = -2.2;
            tubeGroup.add(cathode);

            const anodeMat = new THREE.MeshStandardMaterial({ color: 0xcca625, metalness: 0.8, roughness: 0.2 });
            const anodeGeo = new THREE.CylinderGeometry(0.18, 0.18, 0.4, 16, 1, true);
            
            const anode1 = new THREE.Mesh(anodeGeo, anodeMat);
            anode1.rotation.z = Math.PI / 2;
            anode1.position.x = -1.7;
            tubeGroup.add(anode1);

            const anode2 = new THREE.Mesh(anodeGeo, anodeMat);
            anode2.rotation.z = Math.PI / 2;
            anode2.position.x = -1.2;
            tubeGroup.add(anode2);

            const plateMat = new THREE.MeshStandardMaterial({ color: 0x555555, metalness: 0.5 });
            const plateGeo = new THREE.BoxGeometry(0.4, 0.05, 0.3);
            
            const plateTop = new THREE.Mesh(plateGeo, plateMat);
            plateTop.position.set(-0.4, 0.15, 0);
            tubeGroup.add(plateTop);

            const plateBottom = new THREE.Mesh(plateGeo, plateMat);
            plateBottom.position.set(-0.4, -0.15, 0);
            tubeGroup.add(plateBottom);

            scene.add(tubeGroup);
        }

        function spawnElectrons() {
            const intensity = Math.max(1, Math.floor((51 + parseInt(gridSlider.value)) / 8));
            
            for(let i = 0; i < intensity; i++) {
                if(Math.random() < 0.3) {
                    const geo = new THREE.SphereGeometry(0.02, 8, 8);
                    const mat = new THREE.MeshBasicMaterial({ color: 0x00ffff });
                    const mesh = new THREE.Mesh(geo, mat);
                    
                    mesh.position.set(-2.1, (Math.random() - 0.5) * 0.05, (Math.random() - 0.5) * 0.05);
                    scene.add(mesh);
                    electrons.push(mesh);
                }
            }
        }

        function animarElectrons() {
            time += 0.05;
            
            const currentGridValue = parseInt(gridSlider.value);
            const currentFocusValue = parseInt(focusSlider.value);
            const currentHorizValue = parseInt(horizSlider.value);
            
            const focusFactor = (101 - currentFocusValue) / 300;
            const mode = modeSelect.value;

            let targetY = 0;
            let targetZ = 0;

            // Determinar oscilação base
            if (mode === "sine") {
                targetY = Math.sin(time * 2) * 0.8;
            } else if (mode === "tvRaster") {
                targetY = Math.sin(time * 8) * 0.8;
                targetZ = Math.cos(time * 0.5) * 0.8;
            }

            // Aplicar oscilação horizontal customizada via slider (eixo Z no espaço 3D do ecrã)
            if (mode !== "tvRaster" && currentHorizValue > 0) {
                const horizAmplitude = (currentHorizValue / 100) * 0.8;
                targetZ = Math.cos(time * 2.5) * horizAmplitude;
            }

            if (screenGlow) {
                screenGlow.position.y = THREE.MathUtils.lerp(screenGlow.position.y, targetY, 0.1);
                screenGlow.position.z = THREE.MathUtils.lerp(screenGlow.position.z, targetZ, 0.1);
                
                // Escala do foco
                const glowScale = THREE.MathUtils.mapLinear(currentFocusValue, 10, 100, 1.4, 0.15);
                screenGlow.scale.set(glowScale, glowScale, 1);

                // CONTROLO DE INTENSIDADE: Opacidade mapeada dinamicamente baseada no potencial da grade
                // -50 V gera opacidade quase nula (0.05), enquanto 0 V brilha no máximo (0.95)
                const targetOpacity = THREE.MathUtils.mapLinear(currentGridValue, -50, 0, 0.05, 0.95);
                screenGlow.material.opacity = targetOpacity;
            }

            for(let i = electrons.length - 1; i >= 0; i--) {
                let e = electrons[i];
                e.position.x += 0.08;

                if (e.position.x > -0.4) {
                    e.position.y += (targetY - e.position.y) * 0.04;
                    e.position.z += (targetZ - e.position.z) * 0.04;
                }

                e.position.y += (Math.random() - 0.5) * focusFactor;
                e.position.z += (Math.random() - 0.5) * focusFactor;

                if (e.position.x >= 2.0) {
                    scene.remove(e);
                    electrons.splice(i, 1);
                }
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            
            controls.update();
            spawnElectrons();
            animarElectrons();
            
            renderer.render(scene, camera);
        }

        init();
        animate();
    </script>
</body>
</html>
