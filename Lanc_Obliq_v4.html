<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Lançamento de Projéteis - eufisica</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .container {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            max-width: 1000px;
            width: 100%;
        }

        .controls, .results {
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            flex: 1;
            min-width: 280px;
        }

        .control-group {
            margin-bottom: 15px;
        }

        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }

        .control-group input[type="range"] {
            width: 100%;
        }

        .control-group span {
            float: right;
            font-weight: normal;
            color: #007bff;
        }

        .results h2, .controls h2 {
            margin-top: 0;
            color: #444;
            border-bottom: 2px solid #007bff;
            padding-bottom: 5px;
        }

        .result-item {
            margin: 15px 0;
            font-size: 1.1em;
        }

        .result-item strong {
            color: #333;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.2s;
            color: white;
        }

        #btnPlay { background-color: #28a745; }
        #btnPlay:hover { background-color: #218838; }

        #btnPausa { background-color: #ffc107; color: #333; }
        #btnPausa:hover { background-color: #e0a800; }

        #btnReiniciar { background-color: #dc3545; }
        #btnReiniciar:hover { background-color: #c82333; }

        button:disabled {
            background-color: #ccc !important;
            color: #666 !important;
            cursor: not-allowed;
        }

        .canvas-container {
            width: 100%;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-top: 20px;
            box-sizing: border-box;
        }

        canvas {
            width: 100%;
            height: 450px;
            background: #fafafa;
            border: 1px solid #ddd;
            display: block;
        }
    </style>
</head>
<body>

    <h1>Simulador de Lançamento Oblíquo - José Gonçalves (eufisica)</h1>

    <div class="container">
        <div class="controls">
            <h2>Condições iniciais</h2>
            
            <div class="control-group">
                <label for="vel">Velocidade Inicial (<i>v</i><sub>0</sub>): <span id="vel-val">20</span> m/s</label>
                <input type="range" id="vel" min="1" max="50" value="20" step="1">
            </div>

            <div class="control-group">
                <label for="angulo">Ângulo de Lançamento (<i>&theta;</i>): <span id="angulo-val">45</span>°</label>
                <input type="range" id="angulo" min="0" max="90" value="45" step="1">
            </div>

            <div class="control-group">
                <label for="altura">Altura Inicial (<i>y</i><sub>0</sub>): <span id="altura-val">0</span> m</label>
                <input type="range" id="altura" min="0" max="50" value="0" step="0.5">
            </div>

            <div class="button-group">
                <button id="btnPlay">Play</button>
                <button id="btnPausa" disabled>Pausa</button>
                <button id="btnReiniciar">Reiniciar</button>
            </div>
        </div>

        <div class="results">
            <h2>Resultados</h2>
            <div class="result-item">Alcance Horizontal Total: <strong id="res-alcance">0.00</strong> m</div>
            <div class="result-item">Altura Máxima Atingida: <strong id="res-altura-max">0.00</strong> m</div>
            <div class="result-item">Tempo Total de Voo: <strong id="res-tempo">0.00</strong> s</div>
            <div class="result-item" style="border-top: 1px solid #eee; padding-top: 10px; color: #666;">
                Tempo Atual Animação: <strong id="res-tempo-atual" style="color: #007bff;">0.00</strong> s
            </div>
        </div>
    </div>

    <div class="canvas-container">
        <canvas id="simCanvas"></canvas>
    </div>

   <script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');

    // Inputs
    const inputVel = document.getElementById('vel');
    const inputAngulo = document.getElementById('angulo');
    const inputAltura = document.getElementById('altura');
    
    // Botões
    const btnPlay = document.getElementById('btnPlay');
    const btnPausa = document.getElementById('btnPausa');
    const btnReiniciar = document.getElementById('btnReiniciar');

    // Outputs Texto
    const valVel = document.getElementById('vel-val');
    const valAngulo = document.getElementById('angulo-val');
    const valAltura = document.getElementById('altura-val');

    const resAlcance = document.getElementById('res-alcance');
    const resAlturaMax = document.getElementById('res-altura-max');
    const resTempo = document.getElementById('res-tempo');
    const resTempoAtual = document.getElementById('res-tempo-atual');

    // Variáveis de Física e Estado da Animação
    const g = 9.81; 
    let v0, anguloGraus, y0, theta, v0x, v0y; 
    let tVoo, alcance, hMax; 

    let animationRequestId;
    let estaAAnimar = false;
    let tempoSimulacaoDecorrido = 0; 
    
    const passoTempoPorFrame = 0.015; 

    let rastoPosicoes = [];

    function resetFisicaEPrevisualizar() {
        pararAnimação(); 
        tempoSimulacaoDecorrido = 0;
        rastoPosicoes = []; 
        resTempoAtual.innerText = (0).toFixed(2);
        desativarInputs(false); 

        v0 = parseFloat(inputVel.value);
        anguloGraus = parseFloat(inputAngulo.value);
        y0 = parseFloat(inputAltura.value);

        valVel.innerText = v0;
        valAngulo.innerText = anguloGraus;
        valAltura.innerText = y0;

        theta = (anguloGraus * Math.PI) / 180;
        v0x = v0 * Math.cos(theta);
        v0y = v0 * Math.sin(theta);

        // CORREÇÃO AQUI: Caso especial para lançamento perfeitamente horizontal ao nível do chão
        if (y0 === 0 && anguloGraus === 0) {
            tVoo = 5; // Define 5 segundos de movimento contínuo na horizontal
            alcance = v0x * tVoo;
        } else {
            const discriminante = (v0y * v0y) + (2 * g * y0);
            tVoo = (v0y + Math.sqrt(discriminante)) / g;
            alcance = v0x * tVoo;
        }

        const tSubida = v0y / g;
        hMax = y0;
        if (tSubida > 0) {
            hMax = y0 + (v0y * v0y) / (2 * g);
        }

        resAlcance.innerText = alcance.toFixed(2);
        resAlturaMax.innerText = hMax.toFixed(2);
        resTempo.innerText = (y0 === 0 && anguloGraus === 0) ? "∞ (Sem atrito)" : tVoo.toFixed(2);

        desenharCenarioCompleto(tempoSimulacaoDecorrido);
    }

    function desenharCenarioCompleto(tFisicoAtual) {
        if (canvas.width !== canvas.clientWidth || canvas.height !== canvas.clientHeight) {
            canvas.width = canvas.clientWidth;
            canvas.height = canvas.clientHeight;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        const padding = { x: 60, y: 60 };
        const maxValorX = Math.max(alcance, 10);
        const maxValorY = Math.max(hMax, y0, 10);

        const escalaX = (canvas.width - padding.x * 2) / maxValorX;
        const escalaY = (canvas.height - padding.y * 2) / maxValorY;
        const escala = Math.min(escalaX, escalaY);

        const tX = (x) => padding.x + x * escala;
        const tY = (y) => canvas.height - padding.y - (y * escala);

        // 1. Desenhar Solo
        ctx.beginPath();
        ctx.moveTo(tX(-10), tY(0));
        ctx.lineTo(tX(maxValorX + 10), tY(0));
        ctx.strokeStyle = '#444';
        ctx.lineWidth = 3;
        ctx.stroke();

        // 2. Desenhar a Trajetória Teórica de Fundo
        ctx.beginPath();
        ctx.strokeStyle = 'rgba(200, 200, 200, 0.4)';
        ctx.lineWidth = 1.5;
        const passos = 60;
        for (let i = 0; i <= passos; i++) {
            const tRef = (tVoo / passos) * i;
            const xRef = v0x * tRef;
            let yRef = y0 + (v0y * tRef) - (0.5 * g * tRef * tRef);
            if (yRef < 0) yRef = 0; // Garante que a linha teórica não afunda
            if (i === 0) ctx.moveTo(tX(xRef), tY(yRef));
            else ctx.lineTo(tX(xRef), tY(yRef));
        }
        ctx.stroke();

        // 3. Desenhar Rasto
        rastoPosicoes.forEach((pos, index) => {
            ctx.beginPath();
            ctx.arc(tX(pos.x), tY(pos.y), 3, 0, 2 * Math.PI);
            ctx.fillStyle = `rgba(255, 87, 34, ${0.1 + (index / rastoPosicoes.length) * 0.5})`;
            ctx.fill();
        });

        // 4. Calcular posição e velocidades instantâneas
        const tAtualLimitado = Math.min(tFisicoAtual, tVoo);
        const xBola = v0x * tAtualLimitado;
        let yBola = y0 + (v0y * tAtualLimitado) - (0.5 * g * tAtualLimitado * tAtualLimitado);
        if (yBola < 0) yBola = 0; // Garante que a bola fica no solo

        const vxAtual = v0x;
        // Se já está no chão deslizando horizontalmente, a velocidade vertical é 0
        const vyAtual = (y0 === 0 && anguloGraus === 0) ? 0 : (v0y - (g * tAtualLimitado)); 
        const velocidadeModulo = Math.sqrt(vxAtual * vxAtual + vyAtual * vyAtual);

        if (estaAAnimar && tFisicoAtual <= tVoo) {
            if (rastoPosicoes.length === 0 || rastoPosicoes[rastoPosicoes.length - 1].t !== tAtualLimitado) {
                rastoPosicoes.push({ x: xBola, y: yBola, t: tAtualLimitado });
            }
        }

        // 5. Desenhar Vetor Velocidade
        const comprimentoSeta = velocidadeModulo * 2.5; 
        const anguloSeta = Math.atan2(-vyAtual, vxAtual);

        const setaXFim = tX(xBola) + comprimentoSeta * Math.cos(anguloSeta);
        const setaYFim = tY(yBola) + comprimentoSeta * Math.sin(anguloSeta);

        ctx.save();
        ctx.beginPath();
        ctx.moveTo(tX(xBola), tY(yBola));
        ctx.lineTo(setaXFim, setaYFim);
        ctx.strokeStyle = '#28a745'; 
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.translate(setaXFim, setaYFim);
        ctx.rotate(anguloSeta);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(-10, -5);
        ctx.lineTo(-10, 5);
        ctx.fillStyle = '#28a745';
        ctx.fill();
        ctx.restore();

        // 6. Desenhar a Esfera Principal
        ctx.beginPath();
        ctx.arc(tX(xBola), tY(yBola), 10, 0, 2 * Math.PI);
        const gradiente = ctx.createRadialGradient(tX(xBola)-3, tY(yBola)-3, 1, tX(xBola), tY(yBola), 10);
        gradiente.addColorStop(0, '#80bdff'); 
        gradiente.addColorStop(1, '#007bff'); 
        ctx.fillStyle = gradiente;
        ctx.fill();
        ctx.strokeStyle = '#0056b3';
        ctx.lineWidth = 1.5;
        ctx.stroke();
    }

    function frameDeAnimacao() {
        if (!estaAAnimar) return;

        tempoSimulacaoDecorrido += passoTempoPorFrame;

        desenharCenarioCompleto(tempoSimulacaoDecorrido);
        resTempoAtual.innerText = Math.min(tempoSimulacaoDecorrido, tVoo).toFixed(2);

        if (tempoSimulacaoDecorrido >= tVoo) {
            finalizarAnimacao();
        } else {
            animationRequestId = requestAnimationFrame(frameDeAnimacao);
        }
    }

    function iniciarAnimacao() {
        if (estaAAnimar) return;
        if (tempoSimulacaoDecorrido >= tVoo) {
            tempoSimulacaoDecorrido = 0;
            rastoPosicoes = [];
        }

        estaAAnimar = true;
        desativarInputs(true); 
        
        btnPlay.disabled = true;
        btnPlay.innerText = "Continuar"; 
        btnPausa.disabled = false;

        animationRequestId = requestAnimationFrame(frameDeAnimacao);
    }

    function pausarAnimacao() {
        estaAAnimar = false;
        cancelAnimationFrame(animationRequestId);
        btnPlay.disabled = false;
        btnPausa.disabled = true;
    }

    function pararAnimação() {
        estaAAnimar = false;
        cancelAnimationFrame(animationRequestId);
        btnPlay.disabled = false;
        btnPlay.innerText = "Play";
        btnPausa.disabled = true;
    }

    function finalizarAnimacao() {
        pararAnimação();
        desativarInputs(false);
        btnPlay.innerText = "Play";
    }

    function desativarInputs(desativar) {
        inputVel.disabled = desativar;
        inputAngulo.disabled = desativar;
        inputAltura.disabled = desativar;
    }

    inputVel.addEventListener('input', resetFisicaEPrevisualizar);
    inputAngulo.addEventListener('input', resetFisicaEPrevisualizar);
    inputAltura.addEventListener('input', resetFisicaEPrevisualizar);
    btnPlay.addEventListener('click', iniciarAnimacao);
    btnPausa.addEventListener('click', pausarAnimacao);
    btnReiniciar.addEventListener('click', resetFisicaEPrevisualizar);

    window.addEventListener('resize', () => {
        desenharCenarioCompleto(tempoSimulacaoDecorrido);
    });

    resetFisicaEPrevisualizar();
</script>
</body>
</html>
