<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>MCU - José Gonçalves (eufisica)</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #111; color: #fff; display: flex; }
        #controls { width: 350px; padding: 20px; background: #222; border-radius: 8px; margin-right: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #simulation { flex-grow: 1; display: flex; flex-direction: column; align-items: center; }
        canvas { background: #000; border-radius: 8px; border: 1px solid #333; }
        .control-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #aaa; }
        input, select { width: 100%; padding: 8px; background: #333; color: #fff; border: 1px solid #444; border-radius: 4px; }
        .output { margin-top: 20px; padding: 12px; background: #1a1a1a; border-radius: 4px; font-family: monospace; border-left: 4px solid #4b9cd3; }
    </style>
</head>
<body>

<div id="controls">
    <h2>Parâmetros</h2>
    <div class="control-group">
        <label for="planet">Planeta / Corpo:</label>
        <select id="planet" onchange="updatePlanet()">
            <option value="terra">Terra</option>
            <option value="lua">Lua</option>
            <option value="marte">Marte</option>
            <option value="jupiter">Júpiter</option>
        </select>
    </div>
    <div class="control-group">
        <label for="height">Altura (h): <span id="h-val">2000</span> km</label>
        <input type="range" id="height" min="100" max="50000" step="100" value="2000" oninput="calculatePhysics()">
    </div>
    <div class="control-group">
        <label for="mass">Massa do Satélite (m): <span id="m-val">1000</span> kg</label>
        <input type="range" id="mass" min="100" max="10000" step="100" value="1000" oninput="calculatePhysics()">
    </div>

    <div class="output">
        <strong>DADOS DA ÓRBITA:</strong><br><br>
        R_planeta: <span id="out-R">6371</span> km<br>
        Altura (h): <span id="out-h">2000</span> km<br>
        Raio (r): <span id="out-r">8371</span> km<br>
        Velocidade: <span id="out-v">0.00</span> km/s<br>
        Período (T): <span id="out-T">0.00</span> h<br>
        Força Grav: <span id="out-Fg">0.00</span> N
    </div>
</div>

<div id="simulation">
    <canvas id="canvas" width="600" height="600"></canvas>
</div>

<script>
const G = 6.6743e-11;
const data = {
    terra: { M: 5.972e24, R: 6371000, color: '#4b9cd3' },
    lua: { M: 7.342e22, R: 1737400, color: '#a1a1a1' },
    marte: { M: 6.39e23, R: 3389500, color: '#c1440e' },
    jupiter: { M: 1.898e27, R: 6991100, color: '#b07f35' }
};

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let angle = 0;
let physics = {};

function updatePlanet() {
    const p = data[document.getElementById('planet').value];
    const hSlider = document.getElementById('height');
    hSlider.max = (p.R * 3) / 1000; 
    hSlider.value = (p.R * 0.4) / 1000;
    calculatePhysics();
}

function calculatePhysics() {
    const pKey = document.getElementById('planet').value;
    const p = data[pKey];
    const h = parseFloat(document.getElementById('height').value) * 1000;
    const m = parseFloat(document.getElementById('mass').value);
    
    document.getElementById('h-val').innerText = (h/1000).toFixed(0);
    document.getElementById('m-val').innerText = m;

    const r = p.R + h;
    const v = Math.sqrt((G * p.M) / r);
    const T = (2 * Math.PI * r) / v;
    const Fg = (G * p.M * m) / (r * r);

    physics = { v, T, Fg, r, R_p: p.R, h, color: p.color, max_h: parseFloat(document.getElementById('height').max)*1000 };

    document.getElementById('out-R').innerText = (p.R/1000).toFixed(0);
    document.getElementById('out-h').innerText = (h/1000).toFixed(0);
    document.getElementById('out-r').innerText = (r/1000).toFixed(0);
    document.getElementById('out-v').innerText = (v/1000).toFixed(2);
    document.getElementById('out-T').innerText = (T/3600).toFixed(2);
    document.getElementById('out-Fg').innerText = Fg.toFixed(2);
}

function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const cx = canvas.width / 2;
    const cy = canvas.height / 2;
    
    // Escala modificada para garantir folga mesmo em h = 100km (Planeta ligeiramente menor)
    const max_trajectory_radius = physics.R_p + physics.max_h;
    const scale = 220 / max_trajectory_radius; 
    
    const r_pixel = physics.r * scale;
    // Multiplicador visual para afastar proporcionalmente a órbita do planeta
    const visual_r_pixel = r_pixel + 15; 

    // Órbita
    ctx.beginPath();
    ctx.arc(cx, cy, visual_r_pixel, 0, 2 * Math.PI);
    ctx.strokeStyle = '#333';
    ctx.setLineDash([4, 4]);
    ctx.stroke();
    ctx.setLineDash([]);

    // Planeta (Ligeiramente reduzido para manter margem visual estável)
    ctx.beginPath();
    ctx.arc(cx, cy, physics.R_p * scale, 0, 2 * Math.PI);
    ctx.fillStyle = physics.color;
    ctx.fill();

    // Posição do satélite
    const sx = cx + visual_r_pixel * Math.cos(angle);
    const sy = cy + visual_r_pixel * Math.sin(angle);

    // Satélite
    ctx.beginPath();
    ctx.arc(sx, sy, 6, 0, 2 * Math.PI);
    ctx.fillStyle = '#fff';
    ctx.fill();

    // ESCALAMENTO AUTOMÁTICO E DINÂMICO DOS VETORES
    // O comprimento visual baseia-se na proporção do valor atual face ao valor do sistema
    const v_length = Math.min(80, Math.max(25, (physics.v / 5000) * 30));
    const fg_length = Math.min(80, Math.max(25, (physics.Fg / 10000) * 35));

    // Vetor Velocidade (Verde - Tangencial)
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - v_length * Math.sin(angle), sy + v_length * Math.cos(angle));
    ctx.strokeStyle = '#00ff00';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // Vetor Força Gravítica (Vermelho - Centrípeta)
    ctx.beginPath();
    ctx.moveTo(sx, sy);
    ctx.lineTo(sx - fg_length * Math.cos(angle), sy - fg_length * Math.sin(angle));
    ctx.strokeStyle = '#ff3333';
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // VELOCIDADE DA ANIMAÇÃO AUMENTADA (Multiplicador de passo maior)
    angle += (physics.v / physics.r) * 2.5; 

    requestAnimationFrame(draw);
}

updatePlanet();
draw();
</script>
</body>
</html>
