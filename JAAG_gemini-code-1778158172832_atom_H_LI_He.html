<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação do Átomo - José Gonçalves</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1a1a2e;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .controls {
            margin-bottom: 30px;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background-color: #16213e;
            color: #00d2ff;
            border: 2px solid #00d2ff;
            border-radius: 5px;
            transition: 0.3s;
            margin: 0 5px;
        }

        button:hover {
            background-color: #00d2ff;
            color: #1a1a2e;
        }

        .canvas {
            position: relative;
            width: 400px;
            height: 400px;
            border: 1px solid #333;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Núcleo */
        .nucleus {
            position: absolute;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            width: 40px;
            z-index: 10;
        }

        .particle {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            margin: 1px;
        }

        .proton { background-color: #ff4d4d; box-shadow: 0 0 5px #ff4d4d; }
        .neutron { background-color: #ffcc00; box-shadow: 0 0 5px #ffcc00; }

        /* Órbitas */
        .orbit {
            position: absolute;
            border: 1px dashed rgba(255, 255, 255, 0.3);
            border-radius: 50%;
        }

        .orbit-1 { width: 120px; height: 120px; }
        .orbit-2 { width: 220px; height: 220px; }

        /* Eletrões */
        .electron {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #00d2ff;
            border-radius: 50%;
            box-shadow: 0 0 8px #00d2ff;
            top: -5px;
            left: 50%;
            transform: translateX(-50%);
        }

        .orbit-inner {
            width: 100%;
            height: 100%;
            position: relative;
            animation: rotate linear infinite;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .info {
            margin-top: 20px;
            text-align: center;
            max-width: 400px;
        }
    </style>
</head>
<body>

    <h1>Constituição do Átomo - José Gonçalves</h1>
    
    <div class="controls">
        <button onclick="updateAtom('H')">Hidrogénio (H)</button>
        <button onclick="updateAtom('He')">Hélio (He)</button>
        <button onclick="updateAtom('Li')">Lítio (Li)</button>
    </div>

    <div class="canvas" id="canvas">
        <!-- O átomo será gerado aqui pelo JS -->
    </div>

    <div class="info" id="info">
        <h3>Escolhe um elemento para começar</h3>
        <p>Verás os protões (+), neutrões (0) e eletrões (-).</p>
    </div>

    <script>
        const data = {
            'H': { name: 'Hidrogénio', p: 1, n: 0, e: [1], desc: 'O elemento mais simples. Tem 1 protão e 1 eletrão. Geralmente não tem neutrões.' },
            'He': { name: 'Hélio', p: 2, n: 2, e: [2], desc: 'Gás nobre. Tem o primeiro nível de energia completo com 2 eletrões.' },
            'Li': { name: 'Lítio', p: 3, n: 4, e: [2, 1], desc: 'Metal alcalino. Tem 2 eletrões na primeira camada e 1 na camada de valência.' }
        };

        function updateAtom(symbol) {
            const atom = data[symbol];
            const canvas = document.getElementById('canvas');
            const info = document.getElementById('info');
            
            canvas.innerHTML = ''; // Limpar anterior

            // Criar Núcleo
            const nucleus = document.createElement('div');
            nucleus.className = 'nucleus';
            for(let i=0; i<atom.p; i++) nucleus.innerHTML += '<div class="particle proton"></div>';
            for(let i=0; i<atom.n; i++) nucleus.innerHTML += '<div class="particle neutron"></div>';
            canvas.appendChild(nucleus);

            // Criar Órbitas e Eletrões
            atom.e.forEach((count, index) => {
                const orbit = document.createElement('div');
                orbit.className = `orbit orbit-${index + 1}`;
                
                const inner = document.createElement('div');
                inner.className = 'orbit-inner';
                inner.style.animationDuration = (index === 0 ? 3 : 5) + 's';

                for(let i=0; i<count; i++) {
                    const electron = document.createElement('div');
                    electron.className = 'electron';
                    // Distribuir eletrões na órbita
                    const angle = (360 / count) * i;
                    const wrapper = document.createElement('div');
                    wrapper.style.position = 'absolute';
                    wrapper.style.width = '100%';
                    wrapper.style.height = '100%';
                    wrapper.style.transform = `rotate(${angle}deg)`;
                    wrapper.appendChild(electron);
                    inner.appendChild(wrapper);
                }

                orbit.appendChild(inner);
                canvas.appendChild(orbit);
            });

            info.innerHTML = `<h3>${atom.name} (${symbol})</h3><p>${atom.desc}</p>`;
        }
    </script>
</body>
</html>
