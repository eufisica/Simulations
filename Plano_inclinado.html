<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Simulação: Plano Inclinado - José Gonçalves (eufisica)</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #333; }
        .container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1200px;
        }
        .control-panel {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 300px;
        }
        .control-group {
            margin-bottom: 15px;
        }
        .control-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .control-group input[type="range"], .control-group input[type="number"] {
            width: 100%;
        }
        .btn-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        button {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 4px;
            background-color: #007BFF;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover { background-color: #0056b3; }
        button#btn-pause { background-color: #ffc107; color: #333; }
        button#btn-pause:hover { background-color: #e0a800; }
        canvas#simCanvas {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .charts-container {
            width: 100%;
            display: flex;
            gap: 20px;
            margin-top: 20px;
        }
        .chart-box {
            flex: 1;
            background: #fff;
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            min-width: 300px;
        }
    </style>
</head>
<body>

    <h1>Simulação de Plano Inclinado - José Gonçalves (eufisica)</h1>

    <div class="container">
        <canvas id="simCanvas" width="600" height="400"></canvas>

        <div class="control-panel">
            <h3>Controlos</h3>
            <div class="control-group">
                <label>Altura (<i>h</i>): <span id="val-h">150</span> m</label>
                <input type="range" id="input-h" min="50" max="300" value="150">
            </div>
            <div class="control-group">
                <label>Massa (<i>m</i>): <span id="val-m">5</span> kg</label>
                <input type="range" id="input-m" min="1" max="20" value="5" step="0.5">
            </div>
            <div class="control-group">
                <label>Coef. Atrito (<i>&mu;</i>): <span id="val-mu">0.00</span></label>
                <input type="range" id="input-mu" min="0" max="1" value="0" step="0.05">
            </div>
            <div class="btn-group">
                <button id="btn-start">Iniciar</button>
                <button id="btn-pause">Pausar</button>
                <button id="btn-reset">Reiniciar</button>
            </div>
            <div style="margin-top: 20px; font-size: 0.9em; color: #555;">
                <strong>Ângulo (<i>&alpha;</i>):</strong> <span id="val-alpha">0</span>°
            </div>
        </div>

        <div class="charts-container">
            <div class="chart-box">
                <canvas id="chartEnergia"></canvas>
            </div>
            <div class="chart-box">
                <canvas id="chartCinematica"></canvas>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('simCanvas');
        const ctx = canvas.getContext('2d');

        // Elementos do DOM
        const inputH = document.getElementById('input-h');
        const inputM = document.getElementById('input-m');
        const inputMu = document.getElementById('input-mu');
        const valH = document.getElementById('val-h');
        const valM = document.getElementById('val-m');
        const valMu = document.getElementById('val-mu');
        const valAlpha = document.getElementById('val-alpha');

        // Constantes Físicas e de Simulação
        const g = 9.81; 
        const scaleTime = 0.05; // Fator de escala para o tempo da simulação

        // Parâmetros fixos do plano geométrico no Canvas
        const xBaseEsquerda = 100;
        const xBaseDireita = 500;
        const yBase = 350;
        const comprimentoBase = xBaseDireita - xBaseEsquerda;

        // Estado da simulação
        let h = parseFloat(inputH.value);
        let m = parseFloat(inputM.value);
        let mu = parseFloat(inputMu.value);
        
        let alpha = Math.atan(h / comprimentoBase);
        let comprimentoPlano = Math.sqrt(comprimentoBase**2 + h**2);

        let blocoPosPlano = 0; // Posição d ao longo do plano (0 = topo)
        let velocidade = 0;
        let tempo = 0;
        let emExecucao = false;

        // Dados para os gráficos
        let dadosTempo = [];
        let dadosEc = [], dadosEp = [], dadosEtotal = [];
        let dadosPos = [], dadosVel = [];

        // Inicialização dos Gráficos (Chart.js)
        const ctxEnergia = document.getElementById('chartEnergia').getContext('2d');
        const chartEnergia = new Chart(ctxEnergia, {
            type: 'line',
            data: {
                labels: dadosTempo,
                datasets: [
                    { label: 'E. Cinética (Ec)', data: dadosEc, borderColor: 'red', fill: false, tension: 0.1 },
                    { label: 'E. Potencial (Ep)', data: dadosEp, borderColor: 'blue', fill: false, tension: 0.1 },
                    { label: 'E. Total', data: dadosEtotal, borderColor: 'green', borderDash: [5,5], fill: false, tension: 0.1 }
                ]
            },
            options: { responsive: true, plugins: { title: { display: true, text: 'Energia (J) vs Tempo' } }, scales: { x: { title: { display: true, text: 'Tempo (s)' } } } }
        });

        const ctxCinematica = document.getElementById('chartCinematica').getContext('2d');
        const chartCinematica = new Chart(ctxCinematica, {
            type: 'line',
            data: {
                labels: dadosTempo,
                datasets: [
                    { label: 'Posição (m)', data: dadosPos, borderColor: 'purple', yAxisID: 'yPos', fill: false },
                    { label: 'Velocidade (m/s)', data: dadosVel, borderColor: 'orange', yAxisID: 'yVel', fill: false }
                ]
            },
            options: {
                responsive: true,
                plugins: { title: { display: true, text: 'Cinemática vs Tempo' } },
                scales: {
                    x: { title: { display: true, text: 'Tempo (s)' } },
                    yPos: { type: 'linear', display: true, position: 'left', title: { display: true, text: 'Posição' } },
                    yVel: { type: 'linear', display: true, position: 'right', grid: { drawOnChartArea: false }, title: { display: true, text: 'Velocidade' } }
                }
            }
        });

        // Atualizar valores do input
        function atualizarParametros() {
            h = parseFloat(inputH.value);
            m = parseFloat(inputM.value);
            mu = parseFloat(inputMu.value);

            valH.innerText = h;
            valM.innerText = m;
            valMu.innerText = mu.toFixed(2);
            
            alpha = Math.atan(h / comprimentoBase);
            valAlpha.innerText = (alpha * (180 / Math.PI)).toFixed(1);
            comprimentoPlano = Math.sqrt(comprimentoBase**2 + h**2);
            
            if (!emExecucao && blocoPosPlano === 0) {
                desenharCenário();
            }
        }

        inputH.addEventListener('input', () => { resetSim(); atualizarParametros(); });
        inputM.addEventListener('input', atualizarParametros);
        inputMu.addEventListener('input', atualizarParametros);

        function desenharCenário() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Coordenadas do triângulo (Plano Inclinado)
            let xTopo = xBaseEsquerda;
            let yTopo = yBase - h;

            // Desenhar Solo
            ctx.strokeStyle = '#333';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(50, yBase);
            ctx.lineTo(550, yBase);
            ctx.stroke();

            // Desenhar Plano Inclinado
            ctx.fillStyle = '#e0e0e0';
            ctx.beginPath();
            ctx.moveTo(xBaseEsquerda, yBase);
            ctx.lineTo(xTopo, yTopo);
            ctx.lineTo(xBaseDireita, yBase);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Ângulo alfa arco
            ctx.beginPath();
            ctx.arc(xBaseDireita, yBase, 30, Math.PI, Math.PI + alpha);
            ctx.stroke();

            // Posição atual do bloco no plano
            let proporcao = blocoPosPlano / comprimentoPlano;
            let xBlocoCentro = xTopo + proporcao * (xBaseDireita - xTopo);
            let yBlocoCentro = yTopo + proporcao * (yBase - yTopo);

            // Desenhar Bloco (rodado conforme o ângulo)
            let tamBloco = 40;
            ctx.save();
            ctx.translate(xBlocoCentro, yBlocoCentro);
            ctx.rotate(alpha);
            
            // Desenhar o retângulo do bloco recuado metade do tamanho para o centro de massa coincidir com (0,0)
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(-tamBloco/2, -tamBloco, tamBloco, tamBloco);
            ctx.strokeStyle = '#000';
            ctx.strokeRect(-tamBloco/2, -tamBloco, tamBloco, tamBloco);

            // Centro de Massa (ponto de origem das forças)
            let cmX = 0;
            let cmY = -tamBloco/2;
            ctx.fillStyle = 'red';
            ctx.beginPath();
            ctx.arc(cmX, cmY, 4, 0, 2*Math.PI);
            ctx.fill();

            // --- DESENHO DAS FORÇAS (Vetores) ---
            let escalaForca = 5 / m; // Escala visual para os vetores

            // Força Peso (Sempre vertical para baixo)
            // No referencial rodado do contexto: x_local = F * sin(alpha), y_local = F * cos(alpha)
            let P = m * g;
            ctx.strokeStyle = 'blue';
            ctx.lineWidth = 3;
            desenharVetor(ctx, cmX, cmY, P * Math.sin(alpha) * escalaForca, P * Math.cos(alpha) * escalaForca, 'P');

            // Componente Px (Paralela ao plano, para a frente/direita)
            ctx.strokeStyle = 'cyan';
            desenharVetor(ctx, cmX, cmY, P * Math.sin(alpha) * escalaForca, 0, 'Px');

            // Componente Py (Perpendicular ao plano, para baixo)
            ctx.strokeStyle = 'purple';
            desenharVetor(ctx, cmX, cmY, 0, P * Math.cos(alpha) * escalaForca, 'Py');

            // Força Normal (Perpendicular ao plano, para cima)
            let N = P * Math.cos(alpha);
            ctx.strokeStyle = 'green';
            desenharVetor(ctx, cmX, cmY, 0, -N * escalaForca, 'N');

            // Força de Atrito (Paralela ao plano, para trás)
            let Fa = mu * N;
            if (Fa > 0) {
                ctx.strokeStyle = 'orange';
                desenharVetor(ctx, cmX, cmY, -Fa * escalaForca, 0, 'Fa');
            }

            ctx.restore();
        }

        function desenharVetor(context, x1, y1, dx, dy, legenda) {
            if (Math.abs(dx) < 2 && Math.abs(dy) < 2) return; // Não desenha vetores nulos
            context.beginPath();
            context.moveTo(x1, y1);
            context.lineTo(x1 + dx, y1 + dy);
            context.stroke();

            // Seta do vetor
            let ang = Math.atan2(dy, dx);
            context.beginPath();
            context.moveTo(x1 + dx, y1 + dy);
            context.lineTo(x1 + dx - 8 * Math.cos(ang - Math.PI/6), y1 + dy - 8 * Math.sin(ang - Math.PI/6));
            context.lineTo(x1 + dx - 8 * Math.cos(ang + Math.PI/6), y1 + dy - 8 * Math.sin(ang + Math.PI/6));
            context.closePath();
            context.fillStyle = context.strokeStyle;
            context.fill();

            // Texto da legenda
            context.fillStyle = 'black';
            context.font = '12px Arial';
            context.fillText(legenda, x1 + dx + 5 * Math.cos(ang), y1 + dy + 5 * Math.sin(ang));
        }

        function atualizarFisica() {
            if (!emExecucao) return;

            let Px = m * g * Math.sin(alpha);
            let Py = m * g * Math.cos(alpha);
            let N = Py;
            let Fa = mu * N;

            let forcaResultante = Px - Fa;
            
            // Se o atrito for maior que a componente do peso no início, não se move
            if (forcaResultante <= 0 && velocidade === 0) {
                forcaResultante = 0;
                emExecucao = false;
            }

            let aceleracao = forcaResultante / m;
            
            // Integração numérica simples (Euler)
            velocidade += aceleracao * scaleTime * 60; // Ajuste de escala para o canva visual
            blocoPosPlano += velocidade * scaleTime;
            tempo += scaleTime;

            // Energias (Métricas reais baseadas nos pixéis transformados em metros fictícios)
            let alturaRealRestante = (1 - (blocoPosPlano / comprimentoPlano)) * h / 100; // 100px = 1 metro fictício
            let Ep = m * g * Math.max(0, alturaRealRestante);
            let Ec = 0.5 * m * (velocidade / 100) ** 2; 
            let Etotal = Ep + Ec;

            // Adicionar dados aos gráficos
            dadosTempo.push(tempo.toFixed(2));
            dadosEc.push(Ec);
            dadosEp.push(Ep);
            dadosEtotal.push(Etotal);
            dadosPos.push(blocoPosPlano.toFixed(1));
            dadosVel.push(velocidade.toFixed(1));

            // Limitar número de pontos visíveis no gráfico para performance
            if (dadosTempo.length > 100) {
                dadosTempo.shift(); dadosEc.shift(); dadosEp.shift(); dadosEtotal.shift(); dadosPos.shift(); dadosVel.shift();
            }

            chartEnergia.update('none');
            chartCinematica.update('none');

            // Condição de paragem (Fim do plano inclinado)
            if (blocoPosPlano >= comprimentoPlano) {
                blocoPosPlano = comprimentoPlano;
                velocidade = 0;
                emExecucao = false;
            }
        }

        function loop() {
            atualizarFisica();
            desenharCenário();
            requestAnimationFrame(loop);
        }

        function resetSim() {
            blocoPosPlano = 0;
            velocidade = 0;
            tempo = 0;
            dadosTempo.length = 0;
            dadosEc.length = 0; dadosEp.length = 0; dadosEtotal.length = 0;
            dadosPos.length = 0; dadosVel.length = 0;
            chartEnergia.update();
            chartCinematica.update();
        }

        // Eventos dos Botões
        document.getElementById('btn-start').addEventListener('click', () => { emExecucao = true; });
        document.getElementById('btn-pause').addEventListener('click', () => { emExecucao = false; });
        document.getElementById('btn-reset').addEventListener('click', () => { emExecucao = false; resetSim(); desenharCenário(); });

        // Início
        atualizarParametros();
        loop();
    </script>
</body>
</html>
