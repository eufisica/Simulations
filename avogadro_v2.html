<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulação Dinâmica - Lei de Avogadro - eufisica

    </title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1e272e;
            color: #ef5777;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            justify-content: center;
        }

        h1 { color: #fff; margin: 5px 0; font-size: 1.8rem; text-align: center; }
        p { color: #a4b0be; margin: 0 0 15px 0; text-align: center; font-size: 1rem; }

        /* Contentor Responsivo Principal */
        .main-container {
            display: flex;
            flex-wrap: wrap;
            width: 100%;
            max-width: 1200px;
            gap: 20px;
            justify-content: center;
            align-items: stretch;
        }

        /* Painéis */
        .panel {
            background: #2f3640;
            border-radius: 12px;
            padding: 15px;
            flex: 1;
            min-width: 300px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        /* Área de Simulação (Contentor do Êmbolo) */
        #sim-container {
            width: 100%;
            height: 400px;
            background: #212529;
            border: 4px solid #718093;
            border-bottom-left-radius: 8px;
            border-bottom-right-radius: 8px;
            position: relative;
            overflow: hidden;
        }

        /* O Êmbolo Móvel Dinâmico */
        #piston {
            width: 100%;
            height: 20px;
            background: linear-gradient(to bottom, #dcdde1, #718093);
            position: absolute;
            left: 0;
            bottom: 150px; /* Posição inicial */
            z-index: 10;
            border-top: 2px solid #353b48;
            border-bottom: 2px solid #353b48;
            box-shadow: 0 4px 5px rgba(0,0,0,0.4);
        }

        .molecule {
            width: 8px;
            height: 8px;
            background-color: #00d2d3;
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 0 8px #00d2d3;
        }

        /* Gráfico */
        canvas {
            background: #212529;
            border-radius: 8px;
            width: 100%;
            height: 300px;
        }

        /* Controlos e Estatísticas */
        .controls {
            width: 100%;
            max-width: 1200px;
            margin-top: 15px;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            background: #2f3640;
            padding: 15px;
            border-radius: 12px;
            gap: 15px;
            align-items: center;
        }

        .btn-group { display: flex; gap: 10px; }
        button {
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            border: none;
            border-radius: 6px;
            color: white;
            transition: transform 0.1s, opacity 0.2s;
        }
        button:active { transform: scale(0.95); }
        .btn-add { background-color: #1dd1a1; }
        .btn-remove { background-color: #ff6b6b; }

        .stats-box {
            display: flex;
            gap: 20px;
            color: #fff;
            font-family: monospace;
            font-size: 1.1rem;
        }
        .stats-box span { color: #feca57; font-weight: bold; }
    </style>
</head>
<body>

    <h1>Lei de Avogadro</h1>
    <h2>José Gonçalves - eufisica</h2>
    <p>Observa a variação de Pressão (Colisões) forçar a expansão do Volume</p>

    <div class="main-container">
        <div class="panel">
            <h3 style="color: #fff; margin-top:0;">Recipiente com Êmbolo Móvel</h3>
            <div id="sim-container">
                <div id="piston"></div>
            </div>
        </div>

        <div class="panel">
            <h3 style="color: #fff; margin-top:0;">Média de Colisões (Indicador de Pressão)</h3>
            <canvas id="graphCanvas"></canvas>
        </div>
    </div>

    <div class="controls">
        <div class="btn-group">
            <button class="btn-add" onclick="injetarGas(5)">Injetar +5 Partículas</button>
            <button class="btn-remove" onclick="retirarGas(5)">Retirar -5 Partículas</button>
        </div>
        <div class="stats-box">
            <div>Partículas (n): <span id="moles-display">15</span></div>
            <div>Volume Alvo (V): <span id="volume-display">150</span>L</div>
            <div>Pressão Atual: <span id="pres-display">Estável</span></div>
        </div>
    </div>

    <script>
        const container = document.getElementById('sim-container');
        const piston = document.getElementById('piston');
        const molesDisplay = document.getElementById('moles-display');
        const volumeDisplay = document.getElementById('volume-display');
        const presDisplay = document.getElementById('pres-display');
        const graphCanvas = document.getElementById('graphCanvas');
        const ctx = graphCanvas.getContext('2d');

        // Configuração Física Inicial
        let n = 15; 
        let moleculas = [];
        let alturaPistonAtual = 150; 
        let alturaPistonAlvo = 150;
        
        // Monitorização de Colisões (Pressão)
        let contagemColisoesJanela = 0;
        let historicoColisoes = Array(60).fill(40); // Histórico para o gráfico
        let taxaColisoesEstavel = 40; // Referência estável de colisões

        // Ajuste automático do Canvas ao tamanho do ecrã
        function resizeCanvas() {
            graphCanvas.width = graphCanvas.parentElement.clientWidth - 30;
            graphCanvas.height = 250;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // Inicializar Partículas Iniciais
        for (let i = 0; i < n; i++) {
            criarMolecula(false); 
        }

        function criarMolecula(noTopo = false) {
            let containerWidth = container.clientWidth;
            // Se for injetada agora, entra por baixo. Se for inicial, surge distribuída.
            let spawnY = noTopo ? 10 : Math.random() * (alturaPistonAtual - 20);
            
            let mol = {
                element: document.createElement('div'),
                x: Math.random() * (containerWidth - 15),
                y: spawnY,
                dx: (Math.random() - 0.5) * 6,
                dy: (Math.random() + 0.2) * 4, // Tendência inicial para subir e bater no êmbolo
                colidiuRecentemente: false
            };
            mol.element.className = 'molecule';
            container.appendChild(mol.element);
            moleculas.push(mol);
        }

        function injetarGas(quantidade) {
            if (moleculas.length + quantidade > 50) return; // Limite máximo seguro
            n += quantidade;
            // Atualiza o Alvo Teórico (Lei de Avogadro)
            alturaPistonAlvo = n * 10 + 30; 

            // Adiciona as novas partículas no fundo do recipiente
            for(let i=0; i<quantidade; i++) {
                criarMolecula(true);
            }
            atualizarPainelTexto();
        }

        function retirarGas(quantidade) {
            if (moleculas.length - quantidade < 5) return; // Limite mínimo seguro
            n -= quantidade;
            alturaPistonAlvo = n * 10 + 30;

            // Remove as partículas
            for(let i=0; i<quantidade; i++) {
                let mol = moleculas.pop();
                if(mol) mol.element.remove();
            }
            atualizarPainelTexto();
        }

        function atualizarPainelTexto() {
            molesDisplay.innerText = n;
            volumeDisplay.innerText = Math.round(alturaPistonAlvo * 0.8);
        }

        // Loop Principal de Física Dinâmica
        function update() {
            let containerWidth = container.clientWidth;
            let forçaImpactoTotal = 0;

            moleculas.forEach(mol => {
                mol.x += mol.dx;
                mol.y += mol.dy;

                // Colisões nas Paredes Laterais
                if (mol.x <= 0) { mol.dx *= -1; mol.x = 0; contagemColisoesJanela++; }
                if (mol.x >= containerWidth - 10) { mol.dx *= -1; mol.x = containerWidth - 10; contagemColisoesJanela++; }
                
                // Colisão no Fundo
                if (mol.y <= 0) { mol.dy *= -1; mol.y = 0; contagemColisoesJanela++; }
                
                // COLISÃO CRÍTICA: Com o Êmbolo Móvel (Teto)
                if (mol.y >= (alturaPistonAtual - 10)) {
                    mol.dy *= -1;
                    mol.y = alturaPistonAtual - 10;
                    contagemColisoesJanela++;
                    
                    // Cada colisão no teto gera energia para empurrar o êmbolo para cima
                    forçaImpactoTotal += Math.abs(mol.dy) * 0.25;
                }
            });

            // LÓGICA DINÂMICA DO ÊMBOLO (Empurrão -> Expansão -> Estabilização)
            // Se há muitas partículas colidindo (forçaImpacto), o pistão é forçado a subir em direção ao alvo
            let diferencaAlvo = alturaPistonAlvo - alturaPistonAtual;
            
            // O êmbolo move-se dinamicamente com base nas colisões e na tendência de equilíbrio
            alturaPistonAtual += diferencaAlvo * 0.05 + (forçaImpactoTotal * 0.1) - (diferencaAlvo < 0 ? 0.8 : 0);

            // Restrições de segurança do tamanho do ecrã
            if (alturaPistonAtual < 50) alturaPistonAtual = 50;
            if (alturaPistonAtual > 360) alturaPistonAtual = 360;

            // Aplica a altura calculada visualmente ao CSS
            piston.style.bottom = alturaPistonAtual + 'px';

            // Atualiza os gráficos das moléculas no ecrã
            moleculas.forEach(mol => {
                mol.element.style.left = mol.x + 'px';
                mol.element.style.bottom = mol.y + 'px';
            });

            // Desenhar o Gráfico em tempo real
            desenharGrafico();

            requestAnimationFrame(update);
        }

        // Amostragem de Colisões por Segundo (Frequência)
        setInterval(() => {
            historicoColisoes.push(contagemColisoesJanela);
            historicoColisoes.shift();

            // Média móvel simples para definir o estado visual da Pressão
            let mediaRecente = contagemColisoesJanela;
            let desvioNormal = n * 2.8; 

            if (mediaRecente > desvioNormal + 10) {
                presDisplay.innerText = "ALTA (A Expandir)";
                presDisplay.style.color = "#ff6b6b";
            } else if (mediaRecente < desvioNormal - 10 && alturaPistonAtual > alturaPistonAlvo + 5) {
                presDisplay.innerText = "BAIXA (A Contrair)";
                presDisplay.style.color = "#54a0ff";
            } else {
                presDisplay.innerText = "Estável (Equilíbrio)";
                presDisplay.style.color = "#1dd1a1";
            }

            contagemColisoesJanela = 0; // Faz reset para o próximo segundo
        }, 300);

        // Função para renderizar o Gráfico de Linha do histórico de colisões
        function desenharGrafico() {
            ctx.clearRect(0, 0, graphCanvas.width, graphCanvas.height);
            
            ctx.strokeStyle = '#54a0ff';
            ctx.lineWidth = 3;
            ctx.beginPath();
            
            let espacamentoX = graphCanvas.width / (historicoColisoes.length - 1);
            
            for (let i = 0; i < historicoColisoes.length; i++) {
                // Inverter o Y porque no Canvas o 0 é no topo
                let y = graphCanvas.height - (historicoColisoes[i] * 1.5) - 20;
                if (i === 0) ctx.moveTo(0, y);
                else ctx.lineTo(i * espacamentoX, y);
            }
            ctx.stroke();

            // Linhas de Guia do Gráfico
            ctx.fillStyle = '#a4b0be';
            ctx.font = '12px Arial';
            ctx.fillText("Alta Pressão (Pico de Injeção)", 10, 30);
            ctx.fillText("Pressão de Equilíbrio", 10, graphCanvas.height - 20);
        }

        // Iniciar o ciclo físico
        update();
    </script>
</body>
</html>
